id: mesh-spark
name: Mesh placement -- DGX Spark (GB10 unified memory)
tier: cloud
description: >-
  Placement on the DGX Spark through the mesh delegate. For boxes whose
  own card cannot fit the model (measured on the fleet box: 3.5GB free
  against a 7-10GB need, and an eager local placement crash-looped the
  orchestrator 17+ times) the Spark is the on-demand home that keeps the
  local card free for reasoning. Explicit request or the refusal arm
  names it -- it never wins resolution by accident.

hardware_requirements:
  min_ram_gb: 0
  min_cpu_cores: 0
  gpu_vendor: none
  min_vram_gb: 0
  unified_memory: true
  notes: >-
    The LOCAL box's hardware is irrelevant -- the work happens on the
    Spark. unified_memory names the placement target's shape; scoring
    treats it as advisory so a delegate recipe is never blocked by the
    caller's card.

imagegen_config:
  engine: comfyui
  model_profile: studio
  models:
    - name: studio SDXL stack (fetched on the Spark)
      source: profile://studio
      size_gb: 18.5
      note: Pulled by the delegate entrypoint from AITHER_MODEL_DOWNLOADS.
  serve_args: []
  image: ''
  platform_traps:
    - 'Delegate placement is REPORTED, not shelled out -- the fleet MCP
       tooling does not ship in the public wheel (same rule as cloud-burst).'

deployment:
  target: delegate
  compose_template: ''
  delegate: 'mesh placement on dgx-spark (Aitherium mesh placement tool)'
  port: 8188

backend_config:
  backend_type: comfyui
  health_path: /system_stats
  capability_path: /object_info/CheckpointLoaderSimple
  generate_path: /prompt

verify:
  health_timeout_s: 600
  capability:
    expect_min_models: 1
    description: Same probe as the local recipes, pointed at the Spark's URL.

fleet_wiring:
  catalog_entry:
    backend: comfyui
    category: image
    vram_gb: 0
    max_resolution: 1536
    speed: 6
    quality: 10
  url_env_var: COMFYUI_URL
