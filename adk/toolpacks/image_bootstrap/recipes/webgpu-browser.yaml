id: webgpu-browser
name: In-browser WebGPU (Bonsai) -- the visitor's own GPU
tier: browser
description: >-
  No install, no port, no fleet VRAM: the model downloads once into the
  VISITOR'S browser and runs on THEIR GPU via WebGPU (Bonsai Q1_0 kernels,
  weights streamed from the public HF CDN). The correct lane whenever the
  image is for the visitor to see -- it costs the local box nothing and
  leaves a reasoning-reserved card alone.

hardware_requirements:
  min_ram_gb: 0
  min_cpu_cores: 0
  gpu_vendor: none
  min_vram_gb: 0
  unified_memory: false
  notes: >-
    Runs on the VISITOR's hardware, not the local box -- the host only
    needs a browser. This is the lane that answers a box whose own card
    is reserved for reasoning.

imagegen_config:
  engine: bonsai-webgpu
  model_profile: ''
  models: []
  serve_args: []
  image: ''
  platform_traps:
    - 'Per-visitor download consent gates the load (BCG gate); the catalog
       defaults to the 1.7B and the 27B is a deliberate opt-in.'

deployment:
  target: browser
  compose_template: ''
  browser_url: https://aitherium.com
  port: 0

backend_config:
  backend_type: bonsai-webgpu
  health_path: ''
  capability_path: ''
  generate_path: ''

verify:
  health_timeout_s: 0
  capability:
    expect_min_models: 0
    description: >-
      Nothing to verify on this box: the lane runs in the visitor's
      browser. A local probe of it would test the probe, not the lane.

fleet_wiring:
  catalog_entry:
    backend: bonsai-webgpu
    category: image
    vram_gb: 0
    max_resolution: 1536
    speed: 3
    quality: 6
  url_env_var: ''
