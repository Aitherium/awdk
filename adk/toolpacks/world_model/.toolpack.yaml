# MOVED HERE 2026-09-07. This manifest sat in adk/packs/, which the tool-pack
# loader never scans (_default_dirs reads lib/agents/packs, adk/toolpacks/ and
# ~/.aitheros/packs), so world-model discovered as NOTHING and its wm_* tools
# were absent from every agent -- indistinguishable from the feature being
# switched off. Caught by PTB005.
#
# The CODE deliberately stays at adk/packs/world_model/: five call sites import
# `adk.packs.world_model.env_enroll` / `.tools` (arc-brainpack, tool_readiness,
# the tests), and moving the package to fix a manifest location would break all
# of them. tool_modules below points the loader at the package where it lives.
id: world-model
name: World Model — Learn-Safely Explore & Surprise-Driven Sandbox Bootstrap
version: 1.0.0
description: >-
  World-model engine integration for AitherOS agents. Provides tools to observe
  environment transitions in a learned dynamics model, compute prediction error
  (surprise) for anomaly detection, and bootstrap multi-agent sandboxes with a
  learn-safely explore loop (epsilon-greedy curiosity-seeking). Supports both
  platform-hosted WM service (:8197) and in-process MLPWorldModel when offline.
  All tools fail-soft dict-returners. The explore loop has a hard budget cap and
  sandbox safety by default.
category: learning
tier: free
author: Aitherium
icon: brain
tags: [world-model, world_model, learning, sandbox, curiosity, surprise, anomaly,
       epsilon-greedy, mbrl, dynamics]

mcp_tools:
  - "wm_*"

tool_modules:
  - adk.packs.world_model   # register() lives in its __init__

entitlements: []

mcp_server:
  enabled: true
  description: World-model observation, surprise, and learn-safely explore tools
  entitlement_required: false
  tools: wm_*

skills:
  - world-model-observe
  - learn-safely-explore

persona_fragments:
  - "World model: you have wm_* tools for learning environment dynamics. wm_observe({obs, action, next_obs, reward=0, done=False, domain='sandbox'}) buffers a transition into the model; wm_surprise({items: [{id, obs, action, next_obs}]}) returns prediction errors for anomaly detection; wm_status() returns model health. All tools return dicts (never raise). If env AITHER_OFFLINE=1 or the service is unreachable, tools use an in-process MLPWorldModel (pure Python, no torch required for offline operation). Never retry failed steps; hard budget cap."
  - "wm_observe: record one (obs, action, next_obs, reward, done) transition. Returns {ok: true/false, reason, transitions_buffered}. Loud on failure: if the model is degraded, reason explains why."
  - "wm_surprise: compute prediction error for a batch of (id, obs, action, next_obs) items. Returns {ok, surprises: {id: float|null}} where null means unseen/no prediction yet, 0.0 = predicted exactly, 1.0 = predicted wrong. Surprise is the fitness signal for curiosity-seeking exploration."
  - "wm_status: get model health: {ok, mode: tabular|hybrid|neural, transition_count, neural_available, train_count, last_train_time}. Returns {} if offline (only checked once per process, never re-checks)."
