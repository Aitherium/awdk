id: nemotron-orchestrator-8b
name: Nemotron-Orchestrator-8B (chat / tools / orchestration)
model_role: orchestrator
description: >-
  The AitherOS orchestrator brain — Nemotron-Orchestrator-8B, AWQ-4bit. Chat,
  tool-calling, and coordination. Small and fast; the default interactive model.
  Serve args mirror the fleet's proven aither-vllm config (hermes tool parser,
  auto tool choice, prefix caching).

model:
  served_name: aither-orchestrator
  # quant -> the PRE-QUANTIZED checkpoint that exists for it (best-first). A weight
  # quant is a property of the checkpoint, not a flag — the optimizer picks the best
  # arch-runnable quant AMONG these. The fleet runs the AWQ-4bit (~4.5GiB weights).
  quant_repos:
    awq: cyankiwi/Nemotron-Orchestrator-8B-AWQ-4bit

hardware_requirements:
  min_vram_gb: 8
  min_ram_gb: 16
  gpu_vendor: nvidia

serve:
  port: 8120
  gpu_memory_utilization: 0.40
  max_model_len: 40960
  max_num_seqs: 16
  swap_space_gb: 24
  extra_args:
    - --enable-auto-tool-choice
    - --tool-call-parser hermes
    - --enable-prefix-caching
    - --trust-remote-code
  platform_traps:
    - "This model is tool-calling by design — keep --enable-auto-tool-choice and
       --tool-call-parser hermes or downstream agent loops get no tool schemas."
    - "40K context at gpu-util 0.40 assumes it is NOT co-resident with another big
       model. On a shared 5090 (with ComfyUI/gemma4) drop gpu-util to ~0.32 and
       max-model-len to 16384 — the fleet's aither-vllm-tq values."

verify:
  health_timeout_s: 180
  chat_probe:
    prompt: "Reply with the single word: ready"
    max_tokens: 8
  description: >-
    /v1/chat/completions must return non-empty content AND the served model name
    must match — a wrong served name means routing will never hit this backend.

fleet_wiring:
  catalog_entry:
    backend: vllm
    category: orchestrator
    speed: 111
  url_env_var: AITHER_ORCHESTRATOR_URL
