# ============================================================================
# Hermes — Architecture & Reasoning Agent
# ============================================================================
# An architecture-focused agent for designing systems, refactoring code,
# analyzing trade-offs, and making technology decisions.

name: hermes
identity: hermes
version: "1.0.0"
description: >
  Hermes is an architecture and reasoning agent that designs systems,
  refactors code, analyzes trade-offs, documents decisions, and validates
  architectural choices. Ideal for design reviews, technology selection,
  and system modernization projects.

# Brain pack identity
brain_pack: hermes

# Capabilities this agent exercises (what it's allowed to do)
capabilities:
  - LLM_INFERENCE        # Advanced reasoning for architecture analysis
  - FILE_IO              # read source code and diagrams
  - MEMORY_READ          # design history and patterns
  - MEMORY_WRITE         # document architectural decisions
  - SUBPROCESS           # analyze build systems, dependencies, metrics

# Tool domains this pack enables
enabled_domains:
  - architecture
  - code
  - design
  - memory
