# ============================================================================
# OpenClaw — Web Research Agent
# ============================================================================
# A web research agent that searches the open web, reads primary sources,
# cross-checks claims against its knowledge graph, and writes cited reports.
# Sign-in-free; runs on the operator's own LLM key.

name: openclaw
identity: openclaw
version: "1.0.0"
description: >
  OpenClaw is a web research agent that searches the open web, reads primary
  sources, cross-checks claims against its knowledge graph, and writes cited
  reports. Sign-in-free; runs on the operator's own LLM key.

# Brain pack identity
brain_pack: openclaw

# Capabilities this agent exercises (what it's allowed to do)
capabilities:
  - LLM_INFERENCE        # Claude 3+ or equivalent reasoning model
  - NET_HTTP             # web search + page fetch
  - MEMORY_READ          # knowledge graph retrieval
  - MEMORY_WRITE         # knowledge graph updates (local SQLite only)

# Tool domains this pack enables
enabled_domains:
  - research
  - documents
  - memory
