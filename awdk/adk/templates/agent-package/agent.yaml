name: MyAgent
slug: my-agent
version: "1.0.0"
description: "Custom AI agent with cognitive capabilities"
base_image: ghcr.io/aitherium/adk-cognitive:latest
identity: my-agent

cognitive:
  sase_reasoning: true
  mcts_planning: true
  prism_recovery: true
  council_review: false
  goal_tracking: true
  context_pipeline: true
  crystallization: true
  intent_engine: true

llm:
  backend: ollama
  model: llama3.2:3b
  fallback_model: ""

resources:
  cpu: "2"
  memory: 4Gi
  gpu: false
  vram_gb: 0

ui:
  panels: [chat]
  theme: ""

tools:
  builtin: [file_read, file_write, web_search]
  packs: []
  custom: []

deployment:
  standalone: true
  platform_connect: false
  sovereign: false
