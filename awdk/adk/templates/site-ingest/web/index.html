<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site Ingest Studio</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            text-align: center;
        }
        h1 {
            margin-bottom: 12px;
            font-size: 28px;
            color: #667eea;
        }
        p {
            margin-bottom: 24px;
            font-size: 16px;
            color: #666;
            line-height: 1.5;
        }
        .info {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 16px;
            text-align: left;
            border-radius: 4px;
            margin-bottom: 24px;
        }
        .info strong { color: #667eea; }
        a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Site Ingest Studio</h1>
        <p>Analyze websites and extract brand, content, and SEO metadata into structured SiteSpec JSON.</p>
        <div class="info">
            <p><strong>Getting Started:</strong></p>
            <p>The UI is loading. If this is your first run, check the browser console for any errors. See serve.py for configuration options.</p>
        </div>
        <p><small>Powered by <a href="https://github.com/anthropics/awdk" target="_blank">awdk</a></small></p>
    </div>
</body>
</html>
