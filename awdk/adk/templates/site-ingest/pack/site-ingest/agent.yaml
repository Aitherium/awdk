# ============================================================================
# Site Ingest Agent — Agent Spec
# ============================================================================
# Discovered by adk.pack_discovery.discover_agent_yaml(). Declares the agent's
# name, brain pack, capabilities, and the tool domains it is allowed to use.

name: site-analyst
version: "1.0.0"
description: >
  A website analyst that discovers pages, mirrors content, extracts brand
  tokens and SEO metadata, and produces a structured SiteSpec JSON for
  downstream builders. Sign-in-free; runs on the operator's own LLM key.

brain_pack: site-ingest

# Read/generate only — deliberate scope for content analysis.
capabilities:
  - LLM_INFERENCE
  - NET_HTTP        # web fetch, page retrieval
  - FILE_WRITE      # SiteSpec JSON output

# Tool domains this pack enables
enabled_domains:
  - research
  - analysis
  - documents
