<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aither Agent</title>
<style>
:root{
  color-scheme:light dark;
  --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
  --fg:#e7e9ee; --dim:#9aa3b2; --accent:#4f8cff; --user:#2d3550; --code:#0c0e13;
}
@media(prefers-color-scheme:light){:root{
  --bg:#f4f5f7; --panel:#ffffff; --panel2:#f0f2f5; --line:#e2e5ea;
  --fg:#141824; --dim:#6b7280; --accent:#2563eb; --user:#dce6ff; --code:#f2f3f6;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);
 color:var(--fg);display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);
 background:var(--panel)}
header .dot{width:8px;height:8px;border-radius:50%;background:#3ba55d;flex:none}
header .title{font-weight:650}
header .model{color:var(--dim);font-size:13px;margin-left:2px}
header .spacer{flex:1}
header button.icon{background:none;border:1px solid var(--line);color:var(--dim);border-radius:8px;
 padding:5px 10px;cursor:pointer;font-size:13px}
header button.icon:hover{color:var(--fg);border-color:var(--accent)}
/* settings drawer */
#settings{display:none;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2);
 gap:14px;flex-wrap:wrap;align-items:flex-end}
#settings.open{display:flex}
#settings label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
#settings input,#settings textarea{background:var(--panel);border:1px solid var(--line);color:var(--fg);
 border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}
#settings input[type=range]{padding:0;width:150px}
#settings .sys{flex:1;min-width:240px}
#settings .sys textarea{width:100%;resize:vertical;min-height:38px}
/* conversation */
#log{flex:1;overflow-y:auto;padding:22px 16px;display:flex;flex-direction:column;align-items:center}
.turn{width:100%;max-width:760px;display:flex;gap:12px;padding:12px 0}
.turn .who{flex:none;width:30px;height:30px;border-radius:7px;display:flex;align-items:center;
 justify-content:center;font-size:13px;font-weight:700;color:#fff}
.turn.user .who{background:var(--accent)}
.turn.assistant .who{background:#3ba55d}
.turn .body{flex:1;min-width:0;padding-top:3px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.turn .body pre{background:var(--code);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
 overflow-x:auto;white-space:pre}
.turn .body code{background:var(--code);border-radius:4px;padding:1px 5px;font-size:.92em}
.turn .body pre code{background:none;padding:0}
.turn .body strong{font-weight:670}
.empty{color:var(--dim);text-align:center;margin-top:16vh}
.empty h2{font-weight:650;margin:0 0 6px;color:var(--fg)}
.cursor::after{content:'▋';color:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
/* composer */
form{display:flex;gap:8px;padding:12px 16px 16px;border-top:1px solid var(--line);background:var(--panel);
 justify-content:center}
.composer{width:100%;max-width:760px;display:flex;gap:8px;align-items:flex-end}
#in{flex:1;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg);
 color:var(--fg);font:inherit;resize:none;max-height:180px}
#in:focus{outline:none;border-color:var(--accent)}
button.send{padding:0 18px;height:44px;border:0;border-radius:12px;background:var(--accent);color:#fff;
 font:inherit;font-weight:650;cursor:pointer}
button.send:disabled{opacity:.5;cursor:default}
button.stop{background:#c0392b}
.hint{max-width:760px;width:100%;margin:6px auto 0;color:var(--dim);font-size:11px;text-align:center}
</style>
</head>
<body>
<header>
  <span class="dot"></span>
  <span class="title" id="agentName">Aither Agent</span>
  <span class="model" id="agentModel"></span>
  <select id="agentPick" title="Which agent answers" style="margin-left:10px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px">
    <option value="">this agent (local)</option>
  </select>
  <select id="backendPick" title="Which brain runs inference — switch at will" style="margin-left:8px;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font:inherit;font-size:13px">
    <option value="ondevice">⚡ On-device (WebGPU · free)</option>
    <option value="local">🖥 Local Bonsai-27B</option>
    <option value="genesis">🧠 Genesis (local mesh)</option>
    <option value="mcp">☁ MCP Cloud</option>
    <option value="managed">☁ Managed (gateway)</option>
    <option value="claude">🅰 Claude (BYO key)</option>
    <option value="deepseek">🐳 DeepSeek (BYO key)</option>
  </select>
  <span class="spacer"></span>
  <button class="icon" id="packsBtn" title="Manage packs on the selected agent">📦 Packs</button>
  <button class="icon" id="clearBtn" title="New conversation">＋ New</button>
  <button class="icon" id="gearBtn" title="Settings">⚙ Settings</button>
</header>

<div id="settings">
  <label>Temperature <span id="tempV">0.7</span>
    <input type="range" id="temp" min="0" max="2" step="0.05" value="0.7">
  </label>
  <label>Max tokens
    <input type="number" id="maxtok" value="1024" min="1" max="32768" style="width:100px">
  </label>
</div>

<div id="log">
  <div class="empty" id="empty">
    <h2>Talk to your agent</h2>
    <div>Ask anything. Responses stream token-by-token.</div>
  </div>
</div>

<form id="f">
  <div class="composer">
    <textarea id="in" rows="1" placeholder="Message your agent…  (Enter to send, Shift+Enter for newline)" autofocus></textarea>
    <button type="submit" class="send" id="send">Send</button>
  </div>
</form>
<div class="hint" id="hint"></div>

<script>
(function(){
  var log=document.getElementById('log'), input=document.getElementById('in'),
      form=document.getElementById('f'), btn=document.getElementById('send'),
      empty=document.getElementById('empty'), hint=document.getElementById('hint');
  // Access token/passphrase: from the URL fragment (#k=…, e.g. a shared link),
  // else remembered from a previous connect. The fragment is stripped from the
  // URL after reading so the token is never left in the address bar or history.
  var _frag=(location.hash.match(/[#&]k=([^&]+)/)||[])[1]||'';
  var key=_frag?decodeURIComponent(_frag):(localStorage.getItem('adk_key')||'');
  if(_frag){localStorage.setItem('adk_key',key);history.replaceState(null,'',location.pathname+location.search);}
  var sid=localStorage.getItem('adk_sid')||('web-'+Math.random().toString(36).slice(2));
  localStorage.setItem('adk_sid',sid);
  var busy=false, controller=null;

  function hdrs(h){h=h||{};if(key)h['Authorization']='Bearer '+key;return h;}

  // Inline access gate — shown on a 401 (a remote client without a valid token).
  // Accepts the raw access token OR the passphrase/PIN the owner set via
  // `adk up --passphrase …`. Remembered in localStorage so it is entered once.
  function askKey(el,retryText){
    el.classList.remove('cursor');el.innerHTML='';
    var wrap=document.createElement('div');
    wrap.innerHTML='<div style="color:var(--dim);margin-bottom:8px">This agent is protected. '+
      'Enter your access token or passphrase:</div>';
    var inp=document.createElement('input');inp.type='password';inp.placeholder='token or passphrase';
    inp.style.cssText='padding:9px 11px;border-radius:8px;border:1px solid #333;background:#111;'+
      'color:#eee;width:58%;margin-right:8px;font-size:14px';
    var go=document.createElement('button');go.textContent='Connect';
    go.style.cssText='padding:9px 16px;border-radius:8px;border:0;background:#3b82f6;color:#fff;cursor:pointer';
    wrap.appendChild(inp);wrap.appendChild(go);el.appendChild(wrap);inp.focus();
    function connect(){var v=inp.value.trim();if(!v)return;key=v;localStorage.setItem('adk_key',key);
      el.innerHTML='<span style="color:var(--dim)">Connecting…</span>';send(retryText);}
    go.addEventListener('click',connect);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();connect();}});
  }

  // Minimal, safe markdown: escape first, then fenced code, inline code, bold.
  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  function md(s){
    var out=esc(s);
    out=out.replace(/```([\s\S]*?)```/g,function(_,c){return '<pre><code>'+c.replace(/^\n/,'')+'</code></pre>';});
    out=out.replace(/`([^`\n]+)`/g,'<code>$1</code>');
    out=out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
    return out;
  }
  function turn(role,html){
    if(empty)empty.style.display='none';
    var t=document.createElement('div');t.className='turn '+role;
    var who=document.createElement('div');who.className='who';who.textContent=role==='user'?'You':'AI';
    var body=document.createElement('div');body.className='body';body.innerHTML=html;
    t.appendChild(who);t.appendChild(body);log.appendChild(t);
    log.scrollTop=log.scrollHeight;return body;
  }
  function setBusy(b){
    busy=b;btn.disabled=false;
    if(b){btn.textContent='Stop';btn.classList.add('stop');}
    else{btn.textContent='Send';btn.classList.remove('stop');input.focus();}
  }

  // Header identity
  fetch('/health').then(function(r){return r.json()}).then(function(j){
    if(j&&j.agent)document.getElementById('agentName').textContent=j.agent;
    if(j&&j.model)document.getElementById('agentModel').textContent='· '+j.model;
  }).catch(function(){});

  // Agent picker: discover mesh agents; selecting one routes the chat to that
  // remote agent (it replies on ITS own inference). "" = this local agent.
  var pick=document.getElementById('agentPick');
  fetch('/mesh/agents',{headers:hdrs({})}).then(function(r){return r.json()}).then(function(j){
    (j&&j.agents||[]).forEach(function(a){
      var o=document.createElement('option');o.value=a.name;
      o.textContent=a.name+(a.model?(' · '+a.model):(a.provider_hint?(' · '+a.provider_hint):''));
      pick.appendChild(o);
    });
  }).catch(function(){});

  // Backend switcher — flip the running agent's brain live (no restart).
  // Sovereign Bonsai by default; escalate to genesis/mesh/cloud at will.
  var BACKENDS={
    local:{provider:'openai',base_url:'http://localhost:8201/v1',model:'bonsai-27b'},
    genesis:{provider:'openai',base_url:'http://localhost:8001/v1',model:'aither-orchestrator'},
    mcp:{provider:'openai',base_url:'https://mcp.aitherium.com/v1',model:'aither-orchestrator'},
    managed:{provider:'gateway',base_url:'https://gateway.aitherium.com/v1',model:'aither-orchestrator'},
    claude:{provider:'anthropic',model:'claude-sonnet-4-6',byoKey:true},
    deepseek:{provider:'deepseek',model:'deepseek-chat',byoKey:true}
  };
  var backendPick=document.getElementById('backendPick');
  // Target the SELECTED mesh agent (agentPick) via the /mesh/agents/{name}/admin
  // proxy — so you manage ANY registered agent from here, no SSH. "" = this local agent.
  function adminBase(){var a=agentPick.value;return a?('/mesh/agents/'+encodeURIComponent(a)+'/admin/'):'/admin/';}
  function targetName(){return agentPick.value||'this agent';}
  function doSwitch(p,label,note){
    var body={provider:p.provider,persist:true};
    if(p.base_url)body.base_url=p.base_url; if(p.model)body.model=p.model;
    fetch(adminBase()+'llm/switch',{method:'POST',headers:hdrs({'Content-Type':'application/json'}),body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j}})})
      .then(function(res){
        if(res.ok){note.innerHTML='<span style="color:var(--dim)"><b>'+esc(targetName())+'</b> now using <b>'+label+'</b>'+(p.base_url?(' — '+p.base_url):'')+' ('+p.model+').</span>';return;}
        if(p.byoKey){promptKeyAndRetry(p,label,note);return;}
        note.innerHTML='<span style="color:#e66">Switch failed on '+esc(targetName())+': '+esc(res.j.error||res.j.detail||'error')+'</span>';
      })
      .catch(function(e){note.innerHTML='<span style="color:#e66">Switch error: '+esc(e.message)+'</span>';});
  }
  function promptKeyAndRetry(p,label,note){
    note.innerHTML='';
    var wrap=document.createElement('div');
    wrap.innerHTML='<div style="color:var(--dim);margin-bottom:6px">'+label+' needs an API key (stored locally on this box):</div>';
    var inp=document.createElement('input');inp.type='password';inp.placeholder=p.provider+' API key';
    inp.style.cssText='padding:8px 10px;border-radius:8px;border:1px solid #333;background:#111;color:#eee;width:55%;margin-right:8px';
    var go=document.createElement('button');go.textContent='Save & switch';
    go.style.cssText='padding:8px 14px;border-radius:8px;border:0;background:#3b82f6;color:#fff;cursor:pointer';
    wrap.appendChild(inp);wrap.appendChild(go);note.appendChild(wrap);inp.focus();
    function save(){var k=inp.value.trim();if(!k)return;
      note.innerHTML='<span style="color:var(--dim)">Saving key on '+esc(targetName())+'…</span>';
      fetch(adminBase()+'llm/keys',{method:'POST',headers:hdrs({'Content-Type':'application/json'}),body:JSON.stringify({provider:p.provider,api_key:k})})
        .then(function(r){return r.json()}).then(function(){doSwitch(p,label,note);})
        .catch(function(e){note.innerHTML='<span style="color:#e66">Key save error: '+esc(e.message)+'</span>';});
    }
    go.addEventListener('click',save);
    inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();save();}});
  }
  function odHint(){ hint.innerHTML = backendPick.value==='ondevice'
    ? '⚡ Runs in your browser on your GPU — free &amp; private. First message downloads the model once (~900&nbsp;MB), then it&#39;s cached.'
    : ''; }
  backendPick.addEventListener('change',function(){
    odHint();
    if(backendPick.value==='ondevice'){  // not a server backend — nothing to switch
      turn('assistant','<span style="color:var(--dim)">Switched to <b>on-device</b> — replies run in this browser on your GPU (free, private). The model downloads once on your first message.</span>');
      return;
    }
    var p=BACKENDS[backendPick.value]; if(!p)return;
    var label=backendPick.options[backendPick.selectedIndex].text;
    var note=turn('assistant','<span style="color:var(--dim)">Switching <b>'+esc(targetName())+'</b> to '+label+'…</span>');
    doSwitch(p,label,note);
  });
  odHint();  // on-device is the default-selected backend — show the download expectation up front

  // Pack manager — list / enable / disable / apply packs on the SELECTED agent
  // (through the same proxy). Applying a NOT-enabled pack materializes it too.
  document.getElementById('packsBtn').addEventListener('click',function(){
    var note=turn('assistant','<span style="color:var(--dim)">Loading packs for '+esc(targetName())+'…</span>');
    fetch(adminBase()+'packs',{headers:hdrs({})})
      .then(function(r){return r.ok?r.json():r.json().then(function(j){throw new Error(j.error||('HTTP '+r.status))})})
      .then(function(d){
        var enabled=d.enabled_packs||[], avail=d.available||[];
        note.innerHTML='<div style="color:var(--dim);margin-bottom:6px">Packs on <b>'+esc(targetName())+'</b> — click to enable/apply or disable:</div>';
        var box=document.createElement('div');box.style.cssText='display:flex;flex-wrap:wrap;gap:6px';
        avail.forEach(function(p){
          var on=enabled.indexOf(p.id)>=0;
          var b=document.createElement('button');
          b.textContent=(on?'✓ ':'+ ')+p.id;
          b.style.cssText='padding:6px 10px;border-radius:8px;border:1px solid '+(on?'#3b82f6':'#333')+';background:'+(on?'#1e3a5f':'#111')+';color:#eee;cursor:pointer;font-size:13px';
          b.addEventListener('click',function(){
            var prev=b.textContent; b.disabled=true; b.textContent='…';
            // Toggle the pack IN PLACE. This used to re-trigger packsBtn.click(),
            // which appended a whole fresh "Packs on this agent" list as a new chat
            // message on every click — the runaway-repeat the console showed.
            fetch(adminBase()+(on?'packs/disable':'packs/enable'),{method:'POST',headers:hdrs({'Content-Type':'application/json'}),body:JSON.stringify({pack:p.id})})
              .then(function(r){return r.ok?r.json():r.json().then(function(j){throw new Error(j.error||('HTTP '+r.status))})})
              .then(function(){
                on=!on;
                b.textContent=(on?'✓ ':'+ ')+p.id;
                b.style.borderColor=on?'#3b82f6':'#333';
                b.style.background=on?'#1e3a5f':'#111';
              })
              .catch(function(){b.textContent=prev;})
              .then(function(){b.disabled=false;});
          });
          box.appendChild(b);
        });
        note.appendChild(box);
        if(!avail.length)note.innerHTML+='<span style="color:var(--dim)">(no packs reported)</span>';
      })
      .catch(function(e){note.innerHTML='<span style="color:#e66">Packs unavailable on '+esc(targetName())+': '+esc(e.message)+' (older agent?)</span>';});
  });

  // Settings drawer
  var temp=document.getElementById('temp'), tempV=document.getElementById('tempV');
  temp.addEventListener('input',function(){tempV.textContent=(+temp.value).toFixed(2);});
  document.getElementById('gearBtn').addEventListener('click',function(){
    document.getElementById('settings').classList.toggle('open');});
  document.getElementById('clearBtn').addEventListener('click',function(){
    if(busy&&controller)controller.abort();
    document.querySelectorAll('.turn').forEach(function(n){n.remove();});
    sid='web-'+Math.random().toString(36).slice(2);localStorage.setItem('adk_sid',sid);
    if(empty)empty.style.display='';input.focus();});

  // ── On-device (WebGPU) backend — the SHARED Bonsai brain, the same runtime
  //    aitherium.com and the Living OS use. bonsai-worker.js is built from the awkit
  //    webml library (apps/packages/awkit/src/webml/bonsai-worker-entry.ts); weights
  //    stream from weights.aitherium.com (Range + immutable cache: one download,
  //    cached forever). modelId:'auto' = the library sizes the model for this device.
  //    Protocol: load -> progress* -> ready -> generate -> token* (thinking|answer|tool)
  //    -> done. Single history kept per page.
  var odWorker=null, odLoaded=false, odEverLoaded=false, odEl=null, odAcc='', odPending=null, odLastUser='', odHistory=[];
  // AITHER_WEBML_MEMORY — the kit's memory backend (awkit/webml memory-bundle, mirrored
  // beside this file by AitherVeil/scripts/build-workers.mjs). Same rules as aitherium.com:
  // every turn remembered (IndexedDB), a recall block prepended, the deferred
  // update/delete/ignore pass while this tab is HIDDEN — and only when the visitor ticked
  // 'tidy while hidden' (the kit's `auto` consent). A missing bundle = no memory, said once.
  var odMemP=null, odMem=null, odMemMod=null, odRaw=null, odConvId='adk-webui';
  function odMemory(){
    if(odMemP) return odMemP;
    odMemP=import('/packs/llamacpp/webml-memory.js').then(function(M){
      odMemMod=M; odMem=M.defaultChatMemory();
      M.scheduleSleepPasses({ status:function(){ return (odLoaded&&!odEl&&!odRaw)?'ready':'busy'; },
        generate:odGenerateRaw, memory:odMem });
      return M;
    }).catch(function(e){ console.warn('[on-device] memory backend unavailable:', e&&e.message); return null; });
    return odMemP;
  }
  // One-shot generate on the SAME worker that never touches the chat log — the
  // sleep pass's door. Refuses unless the model is ready and idle.
  function odGenerateRaw(prompt){
    return new Promise(function(resolve,reject){
      if(!odWorker||!odLoaded||odEl||odRaw){ reject(new Error('on-device model busy or not loaded')); return; }
      odRaw={buf:'',resolve:resolve,reject:reject};
      odWorker.postMessage({type:'generate',messages:[{role:'user',content:prompt}],maxTokens:160,temperature:0});
    });
  }
  function odEnsure(){
    if(odWorker) return odWorker;
    odWorker=new Worker('/packs/llamacpp/bonsai-worker.js',{type:'module'});
    odWorker.onmessage=function(e){
      var m=e.data;
      if(m.type==='progress'){
        if(odEl){ var pct=typeof m.progress==='number'?Math.round(m.progress)+'%':'';
          odEl.innerHTML='<span style="color:var(--dim)">On-device: '+(m.file?esc(m.file)+' ':'' )+pct+'</span>';
          log.scrollTop=log.scrollHeight; }
      }
      else if(m.type==='ready'){ odLoaded=true;
        if(odEl){ odEl.innerHTML='<span style="color:var(--dim)">Model ready — compiling…</span>'; }
        if(odPending){ var t=odPending; odPending=null; odGenerate(t); }
      }
      else if(m.type==='token'){ if(odRaw){ odRaw.buf+=m.text; return; } odAcc+=m.text; if(odEl){ odEl.innerHTML=md(odAcc); log.scrollTop=log.scrollHeight; } }
      else if(m.type==='done'){ if(odRaw){ var r=odRaw; odRaw=null; r.resolve(m.text||r.buf); return; }
        if(odEl){ odEl.classList.remove('cursor'); if(!odAcc)odEl.innerHTML='<span style="color:var(--dim)">(no response)</span>'; }
        odHistory.push({role:'user',content:odLastUser}); odHistory.push({role:'assistant',content:odAcc});
        if(odMem&&odAcc){ odMem.remember(odConvId,'assistant',odAcc); }
        odEl=null; setBusy(false); }
      else if(m.type==='error'){ if(odRaw){ var er=odRaw; odRaw=null; er.reject(new Error(m.message||'worker error')); return; } if(odEl){ odEl.classList.remove('cursor'); odEl.innerHTML='⚠ '+esc(m.message); } odEl=null; setBusy(false); }
    };
    // A worker the browser kills for memory posts nothing and may fire no error
    // on some engines — without these the UI would sit at "generating" forever.
    odWorker.onerror=function(){ if(odEl){ odEl.classList.remove('cursor'); odEl.innerHTML='⚠ On-device worker crashed — try again (the model stays cached).'; } odEl=null; setBusy(false); };
    odWorker.onmessageerror=function(){ if(odEl){ odEl.classList.remove('cursor'); odEl.innerHTML='⚠ On-device worker protocol error.'; } odEl=null; setBusy(false); };
    return odWorker;
  }
  function sendOnDevice(text, el){
    if(!('gpu' in navigator)){ el.classList.remove('cursor');
      el.innerHTML='⚠ WebGPU not available here — use Chrome or Edge (or pick another backend).'; setBusy(false); return; }
    if(!odLoaded){
      el.classList.remove('cursor');
      if(!odEverLoaded){
        el.innerHTML='<div style="color:var(--dim);line-height:1.55">⚡ <b>On-device</b> runs the model right here in your browser on your GPU — free, private, nothing leaves this machine. '+
          'It needs a <b>one-time download</b> the first time you use it (236&nbsp;MB–3.6&nbsp;GB, sized to your device; cached forever after).</div>';
        var go=document.createElement('button');go.textContent='Download & start';
        // The click IS the consent (kit record `aitheros-bonsai-consent`); 'tidy while hidden'
        // is the SEPARATE ask for unattended work — off unless ticked.
        var tidy=document.createElement('label'); tidy.style.cssText='display:block;margin-top:8px;color:var(--dim);font-size:13px';
        var tidyBox=document.createElement('input'); tidyBox.type='checkbox'; tidy.appendChild(tidyBox);
        tidy.appendChild(document.createTextNode(' also let it tidy its memory while this tab is hidden'));
        el.appendChild(tidy);
        go.style.cssText='margin-top:10px;padding:9px 16px;border-radius:8px;border:0;background:#3b82f6;color:#fff;cursor:pointer;font-size:14px';
        var el0=el, text0=text;
        go.addEventListener('click',function(){ var auto=!!tidyBox.checked; odMemory().then(function(M){ if(M) M.grantModelConsent(auto); });
          el0.innerHTML=''; el0.classList.add('cursor'); setBusy(true);
          odEl=el0; odEnsure(); odWorker.postMessage({type:'load',modelId:'auto'}); odEverLoaded=true; odPending={text:text0}; });
        el.appendChild(go); setBusy(false); return;
      }
      // Already downloaded once: reload silently (from the immutable cache, no
      // re-download, no second consent).
      el.innerHTML='<span style="color:var(--dim)">Reloading cached on-device model…</span>';
      el.classList.add('cursor'); setBusy(true);
      odEl=el; odEnsure(); odWorker.postMessage({type:'load',modelId:'auto'}); odPending={text:text};
      return;
    }
    odGenerate({text:text,el:el});
  }
  function odGenerate(t){
    odAcc=''; odEl=t.el; odLastUser=t.text; odEl.classList.add('cursor'); setBusy(true);
    if(!odWorker){ odEnsure(); }
    if(!odLoaded){ // not loaded yet: queue and load (model stays cached between uses)
      odEverLoaded=true; odPending={text:t.text};
      odWorker.postMessage({type:'load',modelId:'auto'}); return; }
    // Memory: recall BEFORE the turn is posted, remember the user turn, then generate.
    // Guarded — a memory failure never blocks the send; the recall comes back empty.
    odMemory().then(function(){ return odMem? odMem.recallBlock(odConvId,t.text).catch(function(){return '';}) : ''; }).then(function(block){
      if(odMem) odMem.remember(odConvId,'user',t.text);
      var sys='You are the on-device helper. Be concise.'+(block?'\n\n'+block:'');
      var msgs=[{role:'system',content:sys}].concat(odHistory).concat([{role:'user',content:t.text}]);
      odWorker.postMessage({type:'generate',messages:msgs,
        temperature:parseFloat(temp.value),maxTokens:parseInt(document.getElementById('maxtok').value,10)});
    });
  }
  // Stop for the on-device path: terminate the worker (the model stays in the
  // browser cache — the next use reloads it silently, no re-download).
  function odStop(){
    if(backendPick.value!=='ondevice') return false;
    if(odWorker){ odWorker.terminate(); odWorker=null; }
    odLoaded=false;
    if(odEl){ odEl.classList.remove('cursor'); odEl.innerHTML=(odEl.innerHTML||'')+' <span style="color:var(--dim)">…[stopped]</span>'; odEl=null; }
    setBusy(false); return true;
  }

  async function send(text){
    var body=turn('user',esc(text));
    var el=turn('assistant','');el.classList.add('cursor');
    var acc='', got=false;
    setBusy(true);
    if(backendPick.value==='ondevice'){ sendOnDevice(text, el); return; }
    controller=new AbortController();
    var payload={message:text,session_id:sid,
      temperature:parseFloat(temp.value),max_tokens:parseInt(document.getElementById('maxtok').value,10)};
    // Route to the picked mesh agent (its own inference) or this local agent.
    var who=pick.value;
    var endpoint=who?('/mesh/agents/'+encodeURIComponent(who)+'/chat/stream'):'/chat/stream';
    try{
      var res=await fetch(endpoint,{method:'POST',
        headers:hdrs({'Content-Type':'application/json'}),
        body:JSON.stringify(payload),signal:controller.signal});
      if(!res.ok){el.classList.remove('cursor');
        if(res.status===401){askKey(el,text);setBusy(false);return;}
        el.innerHTML='⚠ '+res.status;setBusy(false);return;}
      var reader=res.body.getReader(),dec=new TextDecoder(),buf='';
      while(true){var c=await reader.read();if(c.done)break;
        buf+=dec.decode(c.value,{stream:true});var idx;
        while((idx=buf.indexOf('\n\n'))>=0){var frame=buf.slice(0,idx);buf=buf.slice(idx+2);
          var line=frame.split('\n').filter(function(l){return l.indexOf('data:')===0})[0];if(!line)continue;
          var d;try{d=JSON.parse(line.slice(5).trim())}catch(e){continue}
          if(d.type==='token'){got=true;acc+=(d.t||'');el.innerHTML=md(acc);log.scrollTop=log.scrollHeight;}
          else if(d.type==='answer'){got=true;acc=d.answer||acc;el.innerHTML=md(acc);log.scrollTop=log.scrollHeight;}
          else if(d.type==='error'){el.classList.remove('cursor');el.innerHTML='⚠ '+esc(d.error||'error');}
        }
      }
    }catch(e){
      if(e.name==='AbortError'){acc+=' …[stopped]';el.innerHTML=md(acc);}
      else{el.classList.remove('cursor');el.innerHTML='⚠ '+esc(e.message);}
    }
    el.classList.remove('cursor');
    if(!got&&!el.innerHTML)el.innerHTML='<span style="color:var(--dim)">(no response)</span>';
    controller=null;setBusy(false);
  }

  form.addEventListener('submit',function(e){
    e.preventDefault();
    if(busy){if(odStop())return;if(controller)controller.abort();return;}
    var t=input.value.trim();if(!t)return;input.value='';autosize();send(t);
  });
  function autosize(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,180)+'px';}
  input.addEventListener('input',autosize);
  input.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
  // Local access (you, on the box) is auto-authenticated by the server, so no
  // token is needed here. If a send actually 401s (a remote client without the
  // token), that is surfaced inline on the response (see the 401 branch above).
  hint.textContent = '';
})();
</script>
</body>
</html>
