id: deepseek-r1-14b
name: DeepSeek-R1-14B (reasoning — mid-tier fallback)
model_role: reasoner
description: >-
  DeepSeek-R1-14B — the AitherOS reasoner alternative from the fleet serving
  recipes. Smaller than qwen-27b, fits a 20GB card, base precision. Use when the
  27B does not fit the hardware but you still want a dedicated reasoning model.

model:
  served_name: deepseek-r1-14b
  quant_repos:
    awq: casperhansen/deepseek-r1-distill-qwen-14b-awq
    base: deepseek-ai/DeepSeek-R1-Distill-Qwen-14B

hardware_requirements:
  min_vram_gb: 16
  min_ram_gb: 24
  gpu_vendor: nvidia

serve:
  port: 8125
  gpu_memory_utilization: 0.80
  max_model_len: 16384
  max_num_seqs: 8
  swap_space_gb: 16
  extra_args:
    - --trust-remote-code
    - --enable-prefix-caching
  platform_traps:
    - "R1 emits <think> reasoning traces — downstream parsers must strip them, and
       max_tokens must be generous or answers truncate mid-reasoning."

verify:
  health_timeout_s: 300
  chat_probe:
    prompt: "What is 17 plus 4? Reply with just the number."
    max_tokens: 64
  description: >-
    Assert non-empty content + served name. Give max_tokens headroom — R1 spends
    tokens thinking before the answer.

fleet_wiring:
  catalog_entry:
    backend: vllm
    category: reasoning
  url_env_var: AITHER_REASONER_URL
