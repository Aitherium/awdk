id: gemma4-12b
name: gemma4-12b (vision / perception / multimodal)
model_role: perception
description: >-
  gemma4-12b — the AitherOS perception/vision model. AWQ-4bit on Blackwell,
  W8A16 (DGX-parity) on Ampere. Multimodal. Serve args mirror the fleet's
  aither-vllm-gemma4 config, including the enforce-eager it requires.

model:
  served_name: gemma4-reasoning
  # AWQ-4bit MoE checkpoint the 5090 runs (the fleet's aither-vllm-gemma4 model).
  quant_repos:
    awq: cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit

hardware_requirements:
  min_vram_gb: 16
  min_ram_gb: 24
  gpu_vendor: nvidia

serve:
  port: 8121
  gpu_memory_utilization: 0.55
  max_model_len: 8192
  max_num_seqs: 8
  swap_space_gb: 16
  # gemma4 REQUIRES enforce-eager on current vLLM builds — the sliding-window +
  # cudagraph-capture path crashes without it. The fleet sets this unconditionally.
  enforce_eager: true
  extra_args:
    - --trust-remote-code
  platform_traps:
    - "enforce-eager is MANDATORY for gemma4 here — dropping it to chase throughput
       reintroduces the cudagraph-capture crash the fleet already hit."
    - "8K context is deliberate: gemma4 at higher ctx + the vision tower blows the
       0.55 VRAM budget on a 5090 that also hosts the orchestrator."

verify:
  health_timeout_s: 240
  chat_probe:
    prompt: "Reply with the single word: ready"
    max_tokens: 8
  description: >-
    /v1/chat/completions returns non-empty content and the served name matches.
    First load is slow (MoE weights) — allow the long timeout before calling it down.

fleet_wiring:
  catalog_entry:
    backend: vllm
    category: perception
  url_env_var: AITHER_PERCEPTION_URL
