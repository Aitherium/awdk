id: finetune
name: Fine-tune That Improves — Train Your Own Model Without Making It Worse
version: 1.0.0
description: >-
  Everything needed to fine-tune a model and know whether it actually got
  better: anchor the capabilities you are NOT teaching with the base model's own
  answers, refuse a corpus that would damage it before any GPU time is spent,
  train through soup-cli or the native path, and compare on the same item set
  against a minimum detectable effect. Then seal the adapter so a stranger can
  verify it, bundle it so they can fetch it, and snapshot the run so a
  regression is one command to undo.
category: training
tier: free
author: Aitherium
icon: flask
tags: [training, finetune, lora, evaluation, provenance]

# EMPTY ON PURPOSE, and this is the interesting line in the file.
#
# A name here is a PROMISE: install this pack and these tools are yours. One
# that binds to nothing is not a loud typo — it is a capability the pack
# advertises, the marketplace prices, and the runtime silently cannot bind, so
# the agent behaves as though the feature is configured off. A pack was measured
# declaring five tools, every one phantom, while the appliance served twelve it
# never named.
#
# This pack's capability is real and lives in a shell plugin
# (adk/shell/plugins/builtins/finetune.py), which shells commands that exist.
mcp_tools: []

tool_modules: []

