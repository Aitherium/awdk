id: planb-ledger
name: Plan B Ledger — One Ledger, Two Faces
version: 0.1.0
description: >-
  Offline-first personal/business continuity ledger. Digital face (Discord bot,
  CLI, agent tools) and paper face (printable structured checkpoint sheets) stay
  interchangeable: work on paper when tech is down, reconcile marks back when it
  returns, with conflict detection so nothing is double-counted. Brain is
  bonsai-27b via llama.cpp (local, no cloud) with a deterministic fallback.
  All tools are fail-soft dict-returners; all state is local JSON.
category: business
tier: free
author: Aitherium
icon: book-open-check
tags: [ledger, budgeting, offline-first, continuity, discord, bonsai, llamacpp, paper]

mcp_tools:
  - "planb_*"
  - "relay_*"

# Empty -> the loader file-loads this pack's __init__.py by path and calls
# register(). The pack ships standalone (relative imports only) — the same
# files are zipped as package `planb` for the consumer install wizard.
tool_modules: []

entitlements: []

mcp_server:
  enabled: true
  description: Plan B Ledger tools (planb_* suite)
  entitlement_required: false
  tools: planb_*

skills: []

persona_fragments:
  - "Plan B Ledger: you have planb_* tools for an offline-first checkbook-discipline
    ledger with a paper face. planb_status reads balance/bills/entries; planb_capture
    parses natural language into entries via local bonsai-27b (llama.cpp :8090) with a
    deterministic fallback — it never needs the cloud; planb_print_sheet checkpoints
    the ledger and renders a printable continuity sheet (PB-NNNN); planb_reconcile
    merges paper marks back, catching bills paid on both faces as conflicts instead of
    double-counting. Entries are append-only; money is integer cents; state is plain
    JSON in ~/.aither/planb the owner can read and back up."
  - "The product philosophy: the paper sheet is not a backup, it is a co-equal
    interface. Interchangeable, not simultaneous — the sheet is 'as of' its checkpoint,
    and reconcile diffs against that checkpoint, never against current state."
  - "planb_sync joins this LOCAL ledger to the tenant ledger on a server
    (POST /api/planb/sync). It unions entries by id on BOTH ends, so it is
    idempotent and safe to retry after a dropped connection, and a bill already
    paid on the other face comes back as a suspected duplicate rather than being
    counted twice — the same rule the paper reconcile uses. Fail-closed: without
    PLANB_API_URL and PLANB_API_TOKEN it returns {error, fix}, never an anonymous
    call. Offline leaves the local ledger untouched; that is the normal case for
    this product, not an error."
