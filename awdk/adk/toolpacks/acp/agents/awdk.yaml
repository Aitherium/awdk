# awdk — this platform's own agent, served over ACP (the server direction).
# Valid AgentPackManifest: runtime.cmd launches `adk acp serve`, so an ACP
# client/editor spawns THIS platform as the agent on stdio.
id: awdk
name: AitherOS Agent (ACP)
version: 2.0.0
description: >-
  AitherOS agent exposed over the Agent Client Protocol. Served by `adk acp
  serve`; an ACP editor or registry client spawns it on stdio and drives it.
  The `adk acp config <editor>` command emits the editor's agent.json for this
  runtime command.
framework: hermes
protocol: acp
runtime:
  type: python
  cmd: adk
  args: ["acp", "serve"]
entrypoint: adk.acp.serve
server_mode: true
serve: |
  adk acp serve                    # serve on stdio (editor-facing)
  adk acp config zed               # emit editor config that launches it
  adk backend add acp --command claude  # drive an EXTERNAL ACP agent instead
