id: cloudflare
name: Cloudflare — Docs, DNS, Workers, Routes & Tunnels
version: 1.0.0
description: >-
  Cloudflare parity for agents. cf_docs_search queries the OFFICIAL Cloudflare
  documentation MCP server (docs.mcp.cloudflare.com, public/no-auth) so the
  agent reads current wrangler/Workers docs instead of hallucinating flags from
  stale memory. Account operations run against the Cloudflare REST API v4 with
  an API token: cf_whoami (token identity + a real capability probe that names
  the exact missing scopes), cf_zones, cf_dns_list / cf_dns_upsert /
  cf_dns_delete, cf_workers_list, cf_worker_routes (a hostname route can belong
  to only ONE worker — check before deploying), cf_worker_deploy (ES-module
  multipart upload + optional route assignment), cf_tunnel_list (cloudflared
  tunnels + their ingress), cf_analytics. Pure HTTP — no wrangler, no SDK, no
  browser OAuth. Every tool fails soft: a missing token or an insufficient
  scope is a STATUS with a fix, never an exception into the agent loop.
category: tool_packs
tier: free
author: Aitherium
icon: cloud
tags: [cloudflare, dns, workers, edge, tunnels, wrangler, docs, infrastructure]

mcp_tools:
  - "cf_*"

# Empty -> the loader file-loads this pack's __init__.py by path (pack dir on
# submodule_search_locations, so `from . import tools` resolves) and calls its
# register(). No monorepo dotted path; the pack ships standalone in the wheel.
tool_modules: []

# Free tier. The docs tool is keyless (public MCP server); account tools need
# the operator's own Cloudflare API token (env, ~/.aither/provider_keys.json,
# or the AitherSecrets vault). No hard gate — tools fail soft with guidance.
entitlements: []

# The 11 Cloudflare skills ported into AitherOS/assets/skills/. AgentForge injects
# these as an [SKILLS] prompt block (capped at 8), so the agent carries Cloudflare's
# own current guidance on wrangler/Workers/DO/Turnstile rather than stale training.
skills:
  - cloudflare-platform
  - cloudflare-wrangler
  - cloudflare-workers-best-practices
  - cloudflare-durable-objects
  - cloudflare-agents-sdk
  - cloudflare-sandbox-sdk
  - cloudflare-email-service
  - cloudflare-one
  - cloudflare-one-migrations
  - cloudflare-turnstile
  - cloudflare-web-perf

persona_fragments:
  - "Cloudflare: you have cf_* tools. ALWAYS call cf_docs_search BEFORE writing wrangler commands, wrangler.toml/wrangler.jsonc, Workers code, bindings, or Pages config. It queries Cloudflare's official documentation MCP server live. Your own memory of Cloudflare flags and APIs is stale and Cloudflare changes them often — the docs are ground truth, you are not. Quote the source URLs it returns."
  - "Account work goes through the REST API v4, not wrangler and not browser OAuth. Read before you write: cf_zones and cf_dns_list before cf_dns_upsert; cf_workers_list and cf_worker_routes before cf_worker_deploy. A route pattern can belong to only ONE Worker — deploying a route another Worker owns hard-fails, so check cf_worker_routes first and say which Worker currently owns the hostname."
  - "When ANY write fails (403 / 'Authentication error' / 'insufficient scope'), immediately call cf_whoami. It probes what the token can actually do and names the exact scopes to add. Report that to the operator instead of retrying — the token is often deliberately read-only, and retrying will never succeed. Never print or echo a Cloudflare API token; the tools return masked values only."
  - "cf_dns_upsert is create-or-update and cf_dns_delete is destructive: confirm the record with cf_dns_list first and tell the operator exactly which record you are about to change."
