id: coderank-embed
name: CodeRankEmbed (code-aware embeddings)
embed_role: code
description: >-
  The AitherOS code embedder — nomic-ai/CodeRankEmbed, for code-aware retrieval
  (function/def-level similarity) rather than prose. Served via vLLM alongside the
  text embedder. Use for codebase GraphRAG; use nomic-text for docs/prose.

model:
  hf_repo: nomic-ai/CodeRankEmbed
  served_name: coderank-embed
  dimension: 768
  max_input_tokens: 2048

hardware_requirements:
  min_vram_gb: 2
  min_ram_gb: 4
  gpu_vendor: nvidia

serve:
  port: 8212
  gpu_memory_utilization: 0.05
  max_model_len: 2048
  max_num_seqs: 64
  dtype: float16
  task: embed
  extra_args:
    - --trust-remote-code     # CodeRankEmbed ships custom modelling code
  platform_traps:
    - "CodeRankEmbed needs --trust-remote-code (custom architecture). Without it
       vLLM refuses to load it."
    - "Code and text embeddings are DIFFERENT vector spaces — do not mix them in one
       graph store. Query code with the code embedder, prose with the text one."

verify:
  health_timeout_s: 120
  expected_dimension: 768
  probe_text: "def add(a, b): return a + b"
  description: >-
    /v1/embeddings returns a 768-float vector. Probe with a code snippet so a
    wrong-task load (generative instead of embed) surfaces immediately.

fleet_wiring:
  url_env_var: AITHER_VLLM_CODE_EMBEDDING_URL
