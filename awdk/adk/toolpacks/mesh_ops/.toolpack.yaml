id: mesh-ops
name: Mesh Ops — Enroll, Run, Register & Deploy Across the AitherMesh
version: 1.0.0
description: >-
  Codifies the AitherMesh node lifecycle as agent-callable tools so an agent (or
  operator) can drive the whole flow without hand-SSHing: list registered mesh
  nodes, run a command on a node over vault-backed SSH, enroll a node onto the
  Headscale control plane, register a node's reachable endpoint + SSH target in
  the fleet registry, and deploy an adk agent onto a node pointed at its own
  inference. All tools are fail-soft dict-returners; SSH creds resolve server-side
  from the vault by name (callers never pass keys).
category: infrastructure
tier: free
author: Aitherium
icon: network
tags: [mesh, headscale, tailscale, node, ssh, deploy, enroll, registry, overlay]

mcp_tools:
  - "mesh_*"

# Empty -> the loader file-loads this pack's __init__.py by path and calls register().
tool_modules: []

entitlements: []

skills:
  - mesh-ops

persona_fragments:
  - "Mesh ops: you have mesh_* tools to run the AitherMesh node lifecycle without hand-SSHing. mesh_list_nodes lists registered mesh nodes; mesh_run_on_node runs a command on a node over vault-backed SSH (via aither_node_ssh.py — creds come from the vault, never from you); mesh_register_endpoint records a node's endpoint + SSH target in the fleet registry; mesh_enroll_node joins a Linux node to the local Headscale control plane (installs the internal CA, adds the /etc/hosts override, tailscale up with a freshly-minted preauth key); mesh_deploy_agent deploys an adk agent onto a node pointed at its own inference (adk up --reach mesh). All return dicts (never raise); missing prerequisites => {\"error\": ..., \"hint\": ...}, never verify=False."
  - "mesh_list_nodes: GET /v1/agent/agent-endpoints (internal-CA verified). Returns {nodes: [{name, invoke_url, reach, model, provider_hint, status, can_ssh}], count}. Fail-soft if the registry is unreachable."
  - "mesh_run_on_node(node, command, linux=True): delegates to AitherOS/tools/aither_node_ssh.py which resolves the node SSH key from the vault by name. Returns {ok, returncode, output}. Only works from the controller/repo root where that runner exists."
  - "mesh_register_endpoint(name, invoke_url, reach='mesh', ssh_host, ssh_user, vault_ssh_key, model, provider_hint): writes to the ManagedAgentEndpointStore (the running genesis reads the same store). vault_ssh_key defaults to <NAME>_SSH_PRIVATE_KEY. reach='mesh' expects an overlay (100.64.x) invoke_url."
  - "mesh_enroll_node(node_host, ssh_user, ssh_key_path, controller_lan_ip, hostname, control_port=8443): mints a 1h reusable preauth key from the aitheros-headscale container, ships the internal CA, and tailscale-ups the node against https://headscale.aitherium.com:<port>. Linux nodes only; WSL2/Windows use the 3220 playbook. Returns {ok, output, hostname}."
  - "mesh_deploy_agent(node_host, ssh_user, ssh_key_path, overlay_ip, inference_url, node_id, port=8080): ensures adk on the node then adk up --yes --force --reach mesh with AITHER_LLM_BASE_URL=<inference_url> and AITHER_MESH_OVERLAY_IP=<overlay_ip>. The node uses its own token. Returns {ok, node, adk_up, output}."
