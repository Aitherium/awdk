id: arc-brainpack
name: ARC Brain — Contribute & Earn
version: 1.0.0
description: >-
  Turnkey crowdsourcing pack for the AitherWorldModel: play real ARC-AGI-3 games
  (with a random policy, or your OWN via arc_enroll's EnvironmentAdapter) and
  contribute every (state, action, next_state) transition to the public
  Contribution Gateway, then track your standing. Six free arc_* tools front a
  self-contained gateway client + a vendored random-policy ARC player (no external
  checkout required):
  arc_register mints/exchanges an ACTA wallet and enrolls a contributor token
  (POST gateway /v1/register, persisted locally); arc_contribute plays N actions
  over the given games and submits transitions; arc_enroll enrolls a real game
  through env_enroll — the ArcGatewayAdapter lets a BYO agent play with its own
  policy while the local world model learns the game and every transition is
  contributed; arc_status returns this token's server-side accept count;
  arc_leaderboard shows the top contributors; and arc_solo prints the one-command
  own-stack bootstrap (docker-compose.standalone.yml) so you can run the world
  model + gateway entirely on your own box. A pack UI tab ("ARC Contribute") shows
  live status + leaderboard + a how-to.
category: tool_packs
author: Aitherium
icon: brain
tags: [arc-agi, world-model, crowdsource, contribute, acta, leaderboard, free]

# Marketplace gate matches these against (tool_name, tool_module).
mcp_tools:
  - "arc_*"
  - "relay_*"

# The pack directory has a hyphen (`arc-brainpack`), which is NOT importable as a
# dotted module, so there is no importable `tool_modules` path. The ADK loader
# detects the empty list and file-loads this pack's __init__.py by path
# (spec_from_file_location with submodule_search_locations = the pack dir), so
# `from . import tools` resolves under that package context. This keeps the pack
# self-contained and free of any host-repo (`lib.*`) dotted path.
tool_modules: []

# Free tier: contributing to the public world model is unmetered — every arc_*
# tool registers UNCONDITIONALLY, no entitlement gate. Submission is still gated
# SERVER-SIDE by the gateway's Bearer token (WM_CONTRIB_TOKEN, minted by
# arc_register); a missing token degrades the tools to readable "not enrolled"
# messages, never an exception.
entitlements: []

skills: []

# Console UI plugin: mounted by the adk admin console as a sandboxed iframe
# (opaque origin, no bearer). Tool calls go through the postMessage bridge
# (/packs/_sdk.js -> aither.invokeTool). This tab polls arc_status and reads
# arc_leaderboard for a live contributor view.
ui:
  assets_dir: ui
  tabs:
    - id: arccontrib
      title: ARC Contribute
      entry: index.html
      icon: brain

persona_fragments:
  - "You front the AitherWorldModel Contribution Gateway. When the operator wants to start contributing, call arc_register FIRST to enroll a contributor token (it mints/exchanges an ACTA wallet, hits the gateway /v1/register, and persists the token) — never invent a token. To contribute, call arc_contribute with the operator's game ids and action budget; relay the submitted/accepted counts faithfully. To enroll a real game so the operator's OWN policy plays it (BYO-cognition), call arc_enroll(game_id) — it runs env_enroll over the ArcGatewayAdapter: the local world model learns the game while every transition is contributed. Use arc_status for this token's standing and arc_leaderboard for the ranking. If the operator would rather run everything locally, call arc_solo and relay the one-command bootstrap verbatim. Every tool is best-effort: if the gateway is down or the token is missing, relay the readable error — do not fabricate acceptance."
