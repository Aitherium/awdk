id: multi-node-rpc-generic
name: Generic multi-node RPC split (N backends)
tier: multi-node-gpu
description: >-
  Model too large for any single node: shard it across the local GPU plus N reachable
  RPC backends. The general case of the bonsai reference topology — backends come
  from detection (AITHER_RPC_BACKENDS or the mesh) rather than being hardcoded.
  This is the recipe that makes community mesh nodes contribute VRAM to one model.

hardware_requirements:
  min_ram_gb: 16
  min_cpu_cores: 4
  gpu_vendor: nvidia
  min_local_vram_gb: 8
  min_combined_vram_gb: 32
  min_rpc_backends: 1
  notes: >-
    Chosen when the model does NOT fit local VRAM but DOES fit the combined pool.
    Every added backend costs a network round trip per operation — a LAN (~1ms) is
    fine; a WAN link will dominate token latency. Check RTT before adding a node.

build:
  source_dir: /work
  build_dir: /work/build-rpc
  cmake_configure:
    - cmake -B build-rpc -DGGML_CUDA=ON -DGGML_RPC=ON -DCMAKE_BUILD_TYPE=Release
  cmake_build:
    - cmake --build build-rpc --config Release -j
  produces:
    - build-rpc/bin/rpc-server
    - build-rpc/bin/llama-server
  est_duration_min: 25

topology:
  main:
    host: local
    device: CUDA0
    vram_gb: 0            # resolved at detection time
  rpc_backends: []        # populated from detection

model:
  name: ""
  path: ""
  size_gb: 0
  quant: gguf

serve:
  main_args:
    - --gpu-layers 99
    - --host 0.0.0.0
    - --port 8080
  rpc_server_args:
    - --host 0.0.0.0
    - --port 50052
  port: 8080
  platform_traps:
    - "EVERY backend must run a rpc-server built from the SAME llama.cpp/ggml version
       as the main node — a protocol mismatch fails at connect."
    - "rpc-server is UNAUTHENTICATED. Bind to the private LAN/mesh interface only.
       On AitherNet, bind the overlay address, never the public NIC."
    - "An unreachable backend can leave you with a healthy LOCAL-ONLY server. If the
       model genuinely does not fit locally you will OOM instead — but when it does
       fit, the fallback is silent. Always split_verify."
    - "--tensor-split lets you weight the shard by each device's VRAM; omit it for an
       even spread. An even spread across unequal GPUs bottlenecks on the smallest."

verify:
  health_timeout_s: 180
  require_rpc_device: true
  expect_min_rpc_devices: 1
  completion:
    prompt: "Explain what pipeline parallelism is, in one sentence."
    max_tokens: 32
    timeout_s: 240
  description: >-
    At least one RPC device must appear in --list-devices, and a completion must
    round-trip. Device count below expect_min_rpc_devices means a backend silently
    dropped out — report it, do not average it away.

fleet_wiring:
  catalog_entry:
    backend: llamacpp-rpc
    category: reasoning
    nodes: 0
  url_env_var: AITHER_LLAMACPP_RPC_URL
