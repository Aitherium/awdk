id: single-node-cuda
name: Single-node CUDA (no split)
tier: single-node-gpu
description: >-
  One machine, one or more local CUDA GPUs, NO RPC backends. The honest fallback
  when nothing else is reachable: a split across zero remote nodes is not a split,
  and this recipe says so rather than pretending. Always faster than an RPC split
  when the model fits locally — network hops cost latency that VRAM headroom does
  not buy back.

hardware_requirements:
  min_ram_gb: 16
  min_cpu_cores: 4
  gpu_vendor: nvidia
  min_local_vram_gb: 8
  min_combined_vram_gb: 8
  min_rpc_backends: 0
  notes: >-
    Selected when the model fits local VRAM or no RPC backend answers. Prefer this
    over a split whenever it fits — RPC adds a network round trip per operation.

build:
  source_dir: /work
  build_dir: /work/build
  cmake_configure:
    - cmake -B build -DGGML_CUDA=ON -DCMAKE_BUILD_TYPE=Release
  cmake_build:
    - cmake --build build --config Release -j
  produces:
    - build/bin/llama-server
  est_duration_min: 20

topology:
  main:
    host: local
    device: CUDA0
    vram_gb: 0            # resolved at detection time
  rpc_backends: []

model:
  name: ""                # caller-supplied
  path: /work/bonsai.gguf
  size_gb: 3.6
  quant: gguf

serve:
  main_args:
    - --gpu-layers 99
    - --host 0.0.0.0
    - --port 8080
  rpc_server_args: []
  port: 8080
  platform_traps:
    - "No RPC backend here BY DESIGN. If you expected a split, split_verify will
       report status='local_only' — that is this recipe working correctly, not a bug."

verify:
  health_timeout_s: 120
  require_rpc_device: false
  expect_min_rpc_devices: 0
  completion:
    prompt: "Explain what pipeline parallelism is, in one sentence."
    max_tokens: 32
    timeout_s: 180
  description: >-
    Health + one completion round-trip. No RPC device is expected or required.

fleet_wiring:
  catalog_entry:
    backend: llamacpp
    category: reasoning
    nodes: 1
  url_env_var: AITHER_LLAMACPP_URL
