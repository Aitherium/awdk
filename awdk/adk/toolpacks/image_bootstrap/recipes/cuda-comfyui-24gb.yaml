id: cuda-comfyui-24gb
name: NVIDIA CUDA 24GB+ ComfyUI (studio + WAN 2.2 video)
tier: gpu-large
description: >-
  NVIDIA GPUs with 24GB+ VRAM. The full creative station: the studio SDXL stack
  PLUS WAN 2.2 image-to-video (two-expert diffusion, fp8 scaled) and 3D-capable
  headroom. Targets 3090, 4090, 5090, A6000.

hardware_requirements:
  min_ram_gb: 32
  min_cpu_cores: 8
  gpu_vendor: nvidia
  min_vram_gb: 24
  unified_memory: false
  notes: >-
    WAN 2.2 i2v runs two 14B experts (high-noise structure, low-noise refinement)
    with UMT5-XXL text encoding — fp8 scaled weights fit 24GB. This is the only
    band where video generation is viable locally.

imagegen_config:
  engine: comfyui
  model_profile: studio
  extra_profiles:
    - wan_2.2
  models:
    - name: studio SDXL stack
      source: profile://studio
      size_gb: 18.5
      note: photoreal + anime bases, ControlNet, IPAdapter, ADetailer
    - name: WAN 2.2 i2v (high + low noise experts)
      source: profile://wan_2.2
      size_gb: 32.0
      note: two-stage i2v video diffusion, fp8 scaled
    - name: UMT5-XXL fp8 text encoder
      source: profile://wan_2.2
      size_gb: 6.7
      note: required by WAN 2.2
  serve_args:
    - COMFY_PORT=8188
  image: ghcr.io/aitherium/comfyui-cloud:latest
  platform_traps:
    - "WAN 2.2 + SDXL resident together will exceed 24GB — ComfyUI unloads between
       workflows, so the first video job after an image job pays a reload cost."

deployment:
  target: docker-compose
  compose_template: remote-comfyui.compose.yml
  delegate: ""
  port: 8188

backend_config:
  backend_type: comfyui
  health_path: /system_stats
  capability_path: /object_info/CheckpointLoaderSimple
  generate_path: /prompt

verify:
  health_timeout_s: 300
  capability:
    expect_min_models: 1
    description: >-
      ComfyUI answers 200 with ZERO checkpoints installed. The capability probe
      lists CheckpointLoaderSimple's available checkpoints — that is the only
      proof the model profile actually landed. Note this profile is ~57GB; the
      first start can take a long time before the probe passes.

fleet_wiring:
  catalog_entry:
    backend: comfyui
    category: image
    vram_gb: 24
    max_resolution: 1536
    speed: 8
    quality: 10
    video: true
  url_env_var: COMFYUI_URL
