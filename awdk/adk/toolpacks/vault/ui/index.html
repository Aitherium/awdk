<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vault</title>
<style>
  :root { color-scheme: light dark;
    --bg:#f6f7f9; --panel:#fff; --ink:#1b2027; --muted:#6b7280; --line:#e3e6ea;
    --accent:#2563eb; --ok:#16a34a; --warn:#d97706; --err:#dc2626; --chip:#eceef2; }
  @media (prefers-color-scheme: dark) { :root {
    --bg:#0f1216; --panel:#171b21; --ink:#e8eaed; --muted:#9aa4b2; --line:#262c34;
    --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --err:#f87171; --chip:#232830; } }
  * { box-sizing:border-box }
  body { margin:0; padding:14px; background:var(--bg); color:var(--ink);
    font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:14px; margin-bottom:12px }
  h2 { margin:0 0 4px; font-size:17px } h3 { margin:0 0 8px; font-size:14px }
  .muted { color:var(--muted) } .mono { font-family:ui-monospace,Menlo,monospace; font-size:12.5px }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center }
  input { flex:1; background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:8px 10px; font:inherit; min-width:120px }
  select { background:var(--bg); color:var(--ink); border:1px solid var(--line);
    border-radius:7px; padding:8px 10px; font:inherit; cursor:pointer }
  button { background:var(--accent); color:#fff; border:none; border-radius:7px;
    padding:7px 12px; font:inherit; cursor:pointer }
  button.ghost { background:var(--chip); color:var(--ink) }
  button.tiny { padding:3px 9px; font-size:12px }
  select.refile { padding:2px 6px; font-size:11px; border-radius:6px; background:var(--bg);
    color:var(--muted); border:1px solid var(--line); cursor:pointer; min-width:auto }
  button:disabled { opacity:.55; cursor:default }
  .item { display:flex; align-items:center; gap:8px; border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; margin:6px 0 }
  .cat { margin:8px 0 }
  .cathead { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer;
    background:var(--chip); border:1px solid var(--line); border-radius:8px; user-select:none; font-weight:600 }
  .cathead:hover { border-color:var(--accent) }
  .caret { width:12px; color:var(--muted) } .catname { flex:1 }
  .catcount { color:var(--muted); font-size:12px; background:var(--bg); border:1px solid var(--line);
    border-radius:20px; padding:1px 9px; font-weight:500 }
  .catbody { padding:2px 0 2px 10px }
  .item .t { font-weight:500; flex:1; word-break:break-all }
  .item .meta { color:var(--muted); font-size:11.5px }
  .reveal { font-family:ui-monospace,Menlo,monospace; font-size:12.5px; color:var(--ok);
    word-break:break-all; margin-top:5px }
  pre { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:9px;
    white-space:pre-wrap; word-break:break-word; margin:8px 0 0; max-height:260px; overflow:auto }
  .spin { display:inline-block; width:12px; height:12px; border:2px solid var(--muted);
    border-top-color:transparent; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px }
  @keyframes sp { to { transform:rotate(360deg) } }
  .stat { display:inline-block; background:var(--chip); border-radius:20px; padding:2px 10px;
    font-size:12px; margin:2px 4px 2px 0 }
  .banner { border:1px solid var(--warn); background:color-mix(in srgb,var(--warn) 12%,transparent);
    border-radius:8px; padding:9px 11px; margin-bottom:12px; font-size:13px }
</style>
</head>
<body>
<h2>Vault Lockbox</h2>
<p class="muted" style="margin-top:0">Browse, reveal, copy, and rotate credentials from the live
  AitherSecrets vault. The master key is sealed in the OS keychain — values copy to the clipboard
  by default and are only shown on an explicit <b>Reveal</b>. Runs through this pack's
  <span class="mono">vault_*</span> tools.</p>

<div id="statusBanner"></div>

<div class="card">
  <div class="row">
    <select id="scope" title="Which secrets to show">
      <option value="mine">Mine</option>
      <option value="tenant">Tenant</option>
      <option value="providers">Providers</option>
      <option value="platform">Platform / system</option>
      <option value="all">Everything</option>
    </select>
    <input id="q" placeholder="Search by name (searches every scope) — optiplex, cloudflare…"
           autocomplete="off">
    <button id="btnList">Refresh</button>
    <button id="btnRefresh" class="ghost">Status</button>
  </div>
  <div id="stats" class="muted" style="margin-top:8px"></div>
  <div id="scopebar" class="muted" style="margin-top:6px;font-size:12px"></div>
  <div id="list"></div>
</div>

<script src="/packs/_sdk.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
    (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

  async function loadStatus() {
    const b = $("statusBanner");
    try {
      const s = await aither.invokeTool("vault_status", {});
      if (!s.reachable) {
        b.innerHTML = '<div class="banner">Vault unreachable — ' + esc(s.detail) +
          (s.hint ? '<br><span class="muted">' + esc(s.hint) + '</span>' : '') + '</div>';
        return false;
      }
      const local = s.mode !== "remote";
      b.innerHTML = local
        ? '<div class="banner">Local-only mode — ' + esc(s.reason) +
          '. These secrets live in your encrypted keyring on this machine and never leave it.' +
          (s.hint ? '<br><span class="muted">' + esc(s.hint) + '</span>' : '') + '</div>'
        : '';
      $("stats").innerHTML =
        `<span class="stat">${esc(s.secret_count)} secrets</span>` +
        `<span class="stat">${local ? "local keyring" : esc(s.vault_url)}</span>` +
        `<span class="stat">${local ? "LOCAL ONLY" : "live vault"}</span>` +
        `<span class="stat">PIN gate: ${s.pin_gate ? "on" : "off"}</span>`;
      return true;
    } catch (e) {
      b.innerHTML = '<div class="banner">Status error: ' + esc(e.message) + '</div>';
      return false;
    }
  }

  const SCOPE_LABEL = { mine: "Mine", tenant: "Tenant", provider: "Providers",
    platform: "Platform / system" };

  async function render(filter) {
    const list = $("list");
    const scope = $("scope").value || "mine";
    list.innerHTML = '<p class="muted"><span class="spin"></span> loading…</p>';
    try {
      const r = await aither.invokeTool("vault_list", { filter: filter || "", scope });
      const items = r.secrets || [];
      // Scope bar: counts per tier + a hint that hidden tiers exist.
      const sc = r.scope_counts || {};
      const filtering = !!(filter && filter.trim());
      $("scopebar").innerHTML = filtering
        ? `Searching all ${r.total || items.length} secrets by name`
        : Object.keys(SCOPE_LABEL).map((k) =>
            `<span class="stat" style="cursor:pointer" data-scope="${k}">${SCOPE_LABEL[k]}: ${sc[k] || 0}</span>`
          ).join("") + (scope !== "all"
            ? ` <span class="muted">— showing ${esc(SCOPE_LABEL[scope] || scope)}; pick another scope or “Everything”.</span>` : "");
      if (!items.length) {
        list.innerHTML = `<p class="muted">No secrets in this scope${filtering ? " matching your search" : ""}. Try a broader scope (Everything).</p>`;
        return;
      }
      // Group by category so 300+ secrets become a handful of collapsible sections.
      const order = ["User", "Workspace", "Tenant", "Platform", "Provider keys",
        "Aither services", "Infrastructure", "Service certs (mTLS)", "Hosts & mesh", "Other / misc"];
      const groups = {};
      for (const it of items) { const c = it.category || "Other / misc"; (groups[c] = groups[c] || []).push(it); }
      const cats = Object.keys(groups).sort((a, b) => {
        const ia = order.indexOf(a), ib = order.indexOf(b);
        return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || a.localeCompare(b);
      });
      list.innerHTML = "";
      const SCOPES = ["mine", "workspace", "tenant", "provider", "platform", "host"];
      function rowHTML(it) {
        const meta = [it.type, it.version ? "v" + it.version : ""].filter(Boolean).join(" · ");
        const opts = SCOPES.map((s) =>
          `<option value="${s}"${s === (it.scope || "mine") ? " selected" : ""}>${s}</option>`).join("");
        return `<span class="t">${esc(it.name)}<span class="meta"> ${esc(meta)}</span></span>` +
          `<select class="tiny refile" data-refile="${esc(it.name)}" title="Re-file scope (non-destructive)">${opts}</select>` +
          `<button class="tiny ghost" data-copy="${esc(it.name)}">Copy</button>` +
          `<button class="tiny ghost" data-reveal="${esc(it.name)}">Reveal</button>` +
          `<button class="tiny" data-rotate="${esc(it.name)}">Rotate</button>`;
      }
      for (const cat of cats) {
        const rows = groups[cat];
        const sec = document.createElement("div"); sec.className = "cat";
        const head = document.createElement("div"); head.className = "cathead";
        head.innerHTML = `<span class="caret">${filtering ? "▾" : "▸"}</span>` +
          `<span class="catname">${esc(cat)}</span><span class="catcount">${rows.length}</span>`;
        const body = document.createElement("div"); body.className = "catbody";
        body.style.display = filtering ? "block" : "none";
        for (const it of rows) {
          const row = document.createElement("div"); row.className = "item";
          row.innerHTML = rowHTML(it); body.appendChild(row);
        }
        head.addEventListener("click", () => {
          const show = body.style.display === "none";
          body.style.display = show ? "block" : "none";
          head.querySelector(".caret").textContent = show ? "▾" : "▸";
        });
        sec.appendChild(head); sec.appendChild(body); list.appendChild(sec);
      }
    } catch (e) { list.innerHTML = `<pre>⚠ ${esc(e.message)}</pre>`; }
  }

  // Event delegation for the per-row buttons.
  $("list").addEventListener("click", async (ev) => {
    const t = ev.target;
    if (t.dataset.copy != null) {
      const name = t.dataset.copy;
      try {
        const r = await aither.invokeTool("vault_get", { name });
        if (r.error) return aither.notify(name + ": " + r.error, "error");
        aither.notify(r.copied ? `${name} copied to clipboard (${r.length} chars)`
                               : `${name}: ${r.masked} (clipboard unavailable)`, r.copied ? "ok" : "warn");
      } catch (e) { aither.notify(e.message, "error"); }
    } else if (t.dataset.reveal != null) {
      const name = t.dataset.reveal, row = t.closest(".item");
      const old = t.textContent; t.disabled = true; t.textContent = "…";
      try {
        const r = await aither.invokeTool("vault_get", { name, reveal: true });
        row.querySelectorAll(".reveal").forEach((n) => n.remove());
        const div = document.createElement("div");
        div.className = "reveal";
        div.textContent = r.error ? ("⚠ " + r.error) : r.value;
        row.appendChild(div);
      } catch (e) { aither.notify(e.message, "error"); }
      t.disabled = false; t.textContent = old;
    } else if (t.dataset.rotate != null) {
      const name = t.dataset.rotate;
      if (!confirm(`Rotate '${name}'? A fresh random value replaces the current one in the vault.\n`
                 + `(Any service still using the old value must be updated separately.)`)) return;
      t.disabled = true;
      try {
        const r = await aither.invokeTool("vault_rotate", { name });
        if (r.error) aither.notify(name + ": " + r.error, "error");
        else aither.notify(`Rotated ${name}: ${r.old_masked} → ${r.new_masked}`
                           + (r.copied ? " (new value copied)" : ""), "ok");
      } catch (e) { aither.notify(e.message, "error"); }
      t.disabled = false;
    }
  });

  // Re-file a secret's scope (the <select> fires "change", not "click").
  $("list").addEventListener("change", async (ev) => {
    const sel = ev.target;
    if (sel.dataset && sel.dataset.refile != null) {
      const name = sel.dataset.refile, scope = sel.value;
      sel.disabled = true;
      try {
        const r = await aither.invokeTool("vault_set_scope", { name, scope });
        if (r.ok) aither.notify(`${name} filed under “${scope}”`, "ok");
        else aither.notify(name + ": " + (r.error || "failed"), "error");
      } catch (e) { aither.notify(e.message, "error"); }
      sel.disabled = false;
    }
  });

  $("btnList").onclick = () => render($("q").value.trim());
  $("q").addEventListener("keydown", (e) => { if (e.key === "Enter") render($("q").value.trim()); });
  $("q").addEventListener("input", () => { if (!$("q").value.trim()) render(""); });
  $("scope").addEventListener("change", () => render($("q").value.trim()));
  $("btnRefresh").onclick = loadStatus;
  // Click a scope-count chip to jump to that scope.
  $("scopebar").addEventListener("click", (ev) => {
    const k = ev.target && ev.target.dataset ? ev.target.dataset.scope : null;
    if (!k) return;
    const val = k === "provider" ? "providers" : k;
    $("scope").value = val; render($("q").value.trim());
  });

  (async () => { if (await loadStatus()) render(""); })();
</script>
</body>
</html>
