id: vault
name: Vault Lockbox — on-demand access to the AitherSecrets vault
version: 1.0.0
description: >-
  Browse, reveal, copy, and rotate credentials from the live AitherSecrets vault
  without curl. The vault master key is sealed in the OS keychain (unlocked by
  your OS login); values copy to the clipboard by default so they never land in
  scrollback. Tools: vault_status, vault_list, vault_search, vault_get,
  vault_rotate — the same lockbox the `adk vault` CLI drives, now in the console.
category: tool_packs
author: Aitherium
icon: lock
tags: [secrets, vault, credentials, lockbox, security]

# Namespaced vault_* so nothing collides with the local-keyring secret_* tools.
mcp_tools:
  - "vault_*"

# register() lives in this pack's __init__.py; the loader file-loads it by path.
tool_modules: []

# Free/local capability — the OS keychain + your vault key are the gate, not a tier.
entitlements: []

skills: []

# Console UI plugin: mounted by the adk admin console as a sandboxed iframe.
# Tool calls go through the postMessage bridge (aither.invokeTool).
ui:
  assets_dir: ui
  tabs:
    - id: main
      title: Vault
      entry: index.html
      icon: lock

persona_fragments:
  - "You can reach the secrets vault with vault_* tools: vault_list / vault_search enumerate secret NAMES (never values); vault_status checks the lockbox is set up and the vault reachable; vault_get retrieves one credential — masked and copied to the clipboard by default, and you must pass reveal=true ONLY when the user explicitly asks to see the value; vault_rotate mints a fresh strong value and stores it. Never print a secret value unless the user explicitly asked to reveal it."
