id: cpu-1bit-llamacpp
name: CPU 1-Bit Bonsai (Q1_0 + llama.cpp)
tier: cpu
description: >-
  Durable 1-bit Bonsai-27B on CPU node (OptiPlex) via PrismML-Eng/llama.cpp
  fork. Minimal footprint (3.8GB GGUF), systemd service, ~4 tok/s reasoning
  background tasks.

hardware_requirements:
  min_ram_gb: 8
  min_cpu_cores: 12
  gpu_vendor: none
  min_vram_gb: 0
  unified_memory: false
  notes: >-
    Mainline llama.cpp cannot load Q1_0 GGUF — requires PrismML-Eng/llama.cpp
    fork. OptiPlex CPU pool alongside Ollama shelf.

inference_config:
  engine: llamacpp
  models:
    - name: bonsai-27b-q1_0
      source: gguf://prism-ml/bonsai-27b-q1_0.gguf
      size_gb: 3.8
      quantization: Q1_0
      # 4096, not 32768: this must match what the delegate's systemd unit actually
      # serves (`-c 4096`), because this value is what the fleet catalog entry
      # below advertises. Advertising 32768 against a server bound to 4096 makes
      # every long-prompt request fail at the node instead of being routed
      # elsewhere. Raise BOTH together (script env CTX=...) if a node has the RAM.
      context_window: 4096
      served_name: bonsai-27b-optiplex
  serve_args:
    - --host 0.0.0.0
    - --port 8090
    - --n-gpu-layers 0
    - --n-threads 12
    - --n-threads-batch 12
    - --ctx-size 4096
    # Bonsai ships the Qwen3 chat template, which force-OPENS `<think>` on every
    # chat turn unless the caller sends chat_template_kwargs.enable_thinking=false.
    # llama-server's default budget is -1 (UNRESTRICTED): the block never closes,
    # so `message.content` comes back EMPTY and the 1-bit quant drifts off-language
    # mid-thought. Worse on CPU — at ~4 tok/s unbounded thinking is minutes of
    # nothing. Bound it here so the node always produces an answer.
    - --reasoning-budget 256
  image: ""
  platform_traps:
    - llama-cpp-fork-only-q1_0
    - no-gpu-layers

deployment:
  # ⚠ `serve_args` above are ADVISORY for this recipe, not deployment
  # config. target=delegate-playbook takes the `elif delegate:` path in
  # node_plan_deployment(), which only REPORTS the script name — _render_compose()
  # is never called, so nothing here reaches a real node.
  #
  # The delegate DOES exist — it lives fleet-side (not in this public pack) at
  # .DEPLOYMENT/scripts/optiplex-node/deploy-bonsai-node.sh, and it is what
  # actually provisions the node: it builds the PrismML fork on the node, fetches
  # the GGUF, and installs the `aither-bonsai-llama` systemd unit. That unit's
  # ExecStart — NOT these serve_args — is the live configuration. Keep the two in
  # sync by hand until a recipe->unit renderer exists; the script's CTX and
  # THINK_BUDGET env vars are the knobs that correspond to --ctx-size and
  # --reasoning-budget here.
  #
  # _render_compose DOES honour serve_args correctly for engine=llamacpp now
  # (fixed 2026-07-25 — it used to silently drop all of them), so a future move to
  # target=docker-compose with a real `image:` would make this block live.
  target: delegate-playbook
  compose_template: ""
  delegate: deploy-bonsai-node.sh   # fleet-side: .DEPLOYMENT/scripts/optiplex-node/
  port: 8090

backend_config:
  backend_type: llamacpp_remote
  health_path: /health
  completion_path: /v1/completions

verify:
  health_timeout_s: 30
  completion:
    model: bonsai-27b-optiplex
    prompt: "What is 2 + 2?"
    min_tokens: 5
    timeout_s: 60

fleet_wiring:
  catalog_entry:
    backend: llamacpp_remote
    category: reasoning
    # must equal inference_config.models[0].context_window — this is the value the
    # fleet router trusts when deciding whether a prompt fits this node.
    context_window: 4096
    vram_gb: 0
    speed: 4
    quality: 7
  ms_env_var: AITHER_GRID_LLAMACPP_URL
