id: github_runners
name: GitHub Runners — fleet visibility, queue diagnosis, ghost cleanup
version: 1.0.0
description: >-
  Answer "why is CI stuck?" without a human reading `gh api` output. runners_status
  cross-references what GitHub LISTS against what actually exists on the host, so a
  GHOST — a registration whose agent died long ago — is visible instead of counting
  as capacity. runners_diagnose_queue checks the LABEL MISMATCH before blaming
  capacity, because "add more runners" is the expensive wrong answer: a job asking
  for `ubuntu-latest` will never match a self-hosted runner no matter how many you
  add. runners_delete_ghost refuses to remove an ONLINE runner and requires explicit
  confirmation for anything else. runners_setup_playbook returns the exact commands
  plus the four traps that break a fleet build, rather than half-performing an
  elevated interactive install. Every tool fails soft: an unreachable `gh` is a
  STATUS that says it could not judge, never a silent "everything is fine".
category: tool_packs
tier: free
author: Aitherium
owner: prometheus
icon: play-circle
tags: [github, actions, ci, runners, self-hosted, devops, free]

mcp_tools:
  - "runners_*"
  - "relay_*"

# Empty -> the loader file-loads this pack's __init__.py by path and calls
# register(). No monorepo dotted path; the pack ships standalone in the wheel.
tool_modules: []

# FREE, and deliberately no entitlement gate. Diagnosing stuck CI is the moment
# you least want a paywall, and every tool here is read-only except
# runners_delete_ghost, which gates itself on confirm=True and refuses online
# runners outright.
entitlements: []

skills:
  - github-runner-fleet
