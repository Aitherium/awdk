# =============================================================================
# AitherOS Deployment Profiles
# =============================================================================
# Defines what each profile requires and which images to pull.

profiles:
  chat-minimal:
    description: "Raw LLM chat — no memory or personality"
    layers: [core]
    specialized: [genesis, veil, microscheduler]
    infrastructure:
      - redis
      - postgres
    min_ram_gb: 8
    min_disk_gb: 30
    gpu_required: false
    min_vram_gb: 0
    containers_approx: 20
    compose_profiles: [chat-minimal]

  chat-full:
    description: "Full personality, memory, context pipeline"
    layers: [core, intelligence, memory]
    specialized: [genesis, veil, microscheduler]
    infrastructure:
      - redis
      - postgres
      - qdrant
    min_ram_gb: 16
    min_disk_gb: 50
    gpu_required: true
    min_vram_gb: 8
    containers_approx: 29
    compose_profiles: [chat-full]

  chat-agents:
    description: "Full chat + agent tool use"
    layers: [core, intelligence, memory]
    specialized: [genesis, veil, microscheduler, atlas]
    infrastructure:
      - redis
      - postgres
      - qdrant
    min_ram_gb: 16
    min_disk_gb: 50
    gpu_required: true
    min_vram_gb: 8
    containers_approx: 31
    compose_profiles: [chat-agents]

  full:
    description: "Complete AitherOS — all layers + all specialized"
    layers: [core, intelligence, autonomic, gateway, social, mcp, memory, perception, training, gpu]
    specialized: [genesis, veil, microscheduler, atlas, saga, lyra, iris, vera, hera, demiurge, themis, bonsai-image]
    infrastructure:
      - redis
      - postgres
      - qdrant
      - minio
    min_ram_gb: 32
    min_disk_gb: 100
    gpu_required: true
    min_vram_gb: 16
    containers_approx: 65
    compose_profiles: [full]

  dev:
    description: "Development environment — core + agents + hot-reload"
    layers: [core, intelligence]
    specialized: [genesis, veil, microscheduler]
    infrastructure:
      - redis
      - postgres
    min_ram_gb: 12
    min_disk_gb: 40
    gpu_required: false
    min_vram_gb: 0
    containers_approx: 25
    compose_profiles: [dev]

  inference-only:
    description: "vLLM inference server only — no orchestration"
    layers: []
    specialized: [microscheduler]
    infrastructure:
      - redis
    min_ram_gb: 8
    min_disk_gb: 20
    gpu_required: true
    min_vram_gb: 8
    containers_approx: 3
    compose_profiles: [inference-only]

  personal-gpu:
    description: "Personal Agent — Nemotron 8B AWQ on 8GB+ GPU (vLLM)"
    layers: [core]
    specialized: [genesis, veil, microscheduler]
    infrastructure:
      - redis
    min_ram_gb: 16
    min_disk_gb: 30
    gpu_required: true
    min_vram_gb: 8
    containers_approx: 6
    compose_profiles: [personal-gpu]

  personal-ollama:
    description: "Personal Agent — Nemotron 8B GGUF on GPU (Ollama)"
    layers: [core]
    specialized: [genesis, veil, microscheduler]
    infrastructure:
      - redis
    min_ram_gb: 16
    min_disk_gb: 30
    gpu_required: true
    min_vram_gb: 6
    containers_approx: 6
    compose_profiles: [personal-ollama]

  creative-image:
    description: "Image generation node — Bonsai Image 4B (ternary FLUX.2 Klein, 4-step)"
    layers: []
    specialized: [microscheduler, bonsai-image]
    infrastructure:
      - redis
    min_ram_gb: 12
    min_disk_gb: 30
    gpu_required: true
    min_vram_gb: 8
    containers_approx: 4
    compose_profiles: [creative-image]

  personal-cpu:
    description: "Personal Agent — Nemotron 8B GGUF on CPU (no GPU needed)"
    layers: [core]
    specialized: [genesis, veil, microscheduler]
    infrastructure:
      - redis
    min_ram_gb: 32
    min_disk_gb: 30
    gpu_required: false
    min_vram_gb: 0
    containers_approx: 6
    compose_profiles: [personal-cpu]
