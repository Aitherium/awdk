# Grid Distributed -- Main PC (RTX 2060 Super 8GB / any 8GB+ NVIDIA GPU)
#
# Multi-node grid: GPU orchestrator + Mac reasoning + CPU cluster
#
# Usage:
#   docker compose -f docker-compose.grid.yml up -d                     # Just vLLM (use adk shell locally)
#   docker compose -f docker-compose.grid.yml --profile node up -d      # vLLM + MCP server in container
#   docker compose -f docker-compose.grid.yml --profile embeddings up -d  # vLLM + embedding model
#
# Requires:
#   - Mac Mini running Ollama with deepseek-r1:8b (see scripts/setup-mac-node.sh)
#   - Cluster nodes running llama.cpp (see scripts/setup-cluster-node.sh)
#
# Env vars:
#   AITHER_GRID_MAC_HOST      Mac Mini IP address
#   AITHER_GRID_CLUSTER_NODES JSON array of cluster node IPs
#   HUGGING_FACE_HUB_TOKEN       HuggingFace token for gated models
#   ADK_VLLM_MODEL               Override model (default: nvidia/Nemotron-Orchestrator-8B)

volumes:
  grid-hf-cache:
  grid-data:

networks:
  grid-net:
    driver: bridge

services:
  # -----------------------------------------------------------------------
  # vLLM Orchestrator -- Nemotron-8B with TQ4 compression (~6.4GB VRAM)
  # -----------------------------------------------------------------------
  adk-vllm-orchestrator:
    image: vllm/vllm-openai:latest
    container_name: adk-vllm-orchestrator
    ports:
      - "8120:8000"
    volumes:
      - grid-hf-cache:/root/.cache/huggingface
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN:-}
      - VLLM_NO_USAGE_STATS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model ${ADK_VLLM_MODEL:-nvidia/Nemotron-Orchestrator-8B}
      --served-model-name aither-orchestrator
      --quantization turboquant
      --gpu-memory-utilization 0.70
      --max-model-len 8192
      --attention-backend TRITON_ATTN
      --dtype auto
      --trust-remote-code
      --disable-log-requests
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --enable-prefix-caching
    networks: [grid-net]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 600s

  # -----------------------------------------------------------------------
  # Embedding model -- shares GPU or falls back to CPU
  # -----------------------------------------------------------------------
  adk-vllm-embed:
    image: vllm/vllm-openai:latest
    container_name: adk-vllm-embed
    profiles: [embeddings]
    ports:
      - "8209:8000"
    volumes:
      - grid-hf-cache:/root/.cache/huggingface
    environment:
      - VLLM_NO_USAGE_STATS=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model nomic-ai/nomic-embed-text-v1.5
      --served-model-name nomic-embed-text
      --gpu-memory-utilization 0.15
      --max-model-len 2048
      --dtype auto
      --trust-remote-code
      --disable-log-requests
    networks: [grid-net]
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # ADK Node -- lightweight MCP server + routing
  # -----------------------------------------------------------------------
  adk-node:
    image: ghcr.io/aitherium/adk-node:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: adk-node
    profiles: [node]
    ports:
      - "8080:8080"
    environment:
      - AITHER_VLLM_URL=http://adk-vllm-orchestrator:8000
      - AITHER_EMBED_URL=http://adk-vllm-embed:8000
      - AITHER_GRID_MAC_HOST=${AITHER_GRID_MAC_HOST:-}
      - AITHER_GRID_CLUSTER_NODES=${AITHER_GRID_CLUSTER_NODES:-[]}
      - AITHER_RECIPE=grid-distributed
    volumes:
      - grid-data:/data
    networks: [grid-net]
    restart: unless-stopped
    depends_on:
      adk-vllm-orchestrator:
        condition: service_healthy
