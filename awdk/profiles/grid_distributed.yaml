# AitherADK Hardware Profile: Grid Distributed
# Multi-node grid: GPU orchestrator + Apple Silicon reasoning + CPU cluster

name: grid_distributed
description: "Multi-node grid: GPU orchestrator + Mac reasoning + CPU cluster fallback"

gpu:
  vendor: nvidia
  min_vram_gb: 6
  max_vram_gb: 12

models:
  default: "nemotron-orchestrator-8b"
  small: "llama3.2:1b"
  large: "deepseek-r1:8b"
  embedding: "nomic-embed-text"

recommended_models:
  - "nemotron-orchestrator-8b"   # Chat/orchestration on local GPU (vLLM TQ4)
  - "deepseek-r1:8b"            # Reasoning on Mac Mini (Ollama Metal)
  - "nomic-embed-text"          # Embeddings on CPU or leftover VRAM
  - "llama3.2:1b"               # PicoLM reflex on cluster nodes

remote_nodes:
  - role: reasoning
    type: apple_silicon
    min_memory_gb: 16
    host: "${AITHER_GRID_MAC_HOST:-}"
    port: 8121
    backend: llamacpp
    models: ["DeepSeek-R1-8B-Q4_K_M"]
  - role: cluster
    type: cpu_only
    min_aggregate_ram_gb: 64
    hosts: "${AITHER_GRID_CLUSTER_NODES:-[]}"
    port: 8121
    backend: llamacpp
    model: "Qwen2.5-32B-Instruct-Q4_K_M.gguf"

vllm:
  enabled: true
  gpu_memory_utilization: 0.70     # Conservative for 8GB
  max_model_len: 8192
  quantization: turboquant         # TQ4 KV cache compression
  attention_backend: TRITON_ATTN   # FlashInfer broken with TQ4
  tensor_parallel_size: 1

ollama:
  local:
    gpu_memory_fraction: 0.0       # Don't compete with vLLM for VRAM
    cpu_only: true
    models_to_pull: ["nomic-embed-text", "llama3.2:1b"]
  # Mac reasoning now uses llama.cpp (not Ollama) for uniform API

cluster:
  backend: llamacpp
  nodes: "${AITHER_GRID_CLUSTER_NODES:-[]}"
  model: "Qwen2.5-32B-Instruct-Q4_K_M.gguf"
  context_size: 4096
  threads_per_node: 8

services:
  core: [node, pulse, watch, chronicle, secrets]
  agents: [genesis]
  scheduling: [micro_scheduler]
  disabled: [parallel, accel, mesh, trainer, prism, vision, voice]

limits:
  max_context: 8192
  max_concurrent: 6
  max_batch_size: 4
  context_pipeline_timeout_s: 25
  ollama_max_loaded_models: 1

notes: >
  Multi-node grid profile for distributed inference.
  RTX 2060 Super (8GB) runs Nemotron-8B TQ4 as orchestrator via vLLM.
  Mac Mini (16GB Apple Silicon) runs DeepSeek-R1 8B for reasoning via llama.cpp + Metal.
  Mini PC cluster (120GB aggregate RAM) runs Qwen2.5-32B Q4 via llama.cpp.
  All remote nodes use llama.cpp with --api-oai for uniform OpenAI-compatible API.
  Effort 1-6 stays on GPU (fast), 7-8 routes to Mac, 9-10 to cluster.
