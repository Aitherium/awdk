# =============================================================================
# awnode — Lightweight Partner Deployment
# =============================================================================
#
# The "skeleton" of AitherOS — runs only the essential services needed to:
#   - Accept and execute AI workloads dispatched from AitherOS Core
#   - Expose local hardware (GPU, storage) via MCP tools
#   - Participate in the AitherOS mesh network
#   - Run a local LLM backend (Ollama or vLLM)
#
# This is NOT a full AitherOS — no training, no agent fleets, no creative
# tools, no social integrations. It's a compute node, orchestrated by Core.
#
# Usage:
#   # Basic (CPU-only, Ollama):
#   docker compose -f docker-compose.node.yml up -d
#
#   # With GPU acceleration + vLLM:
#   docker compose -f docker-compose.node.yml --profile gpu up -d
#
#   # With Veil dashboard:
#   docker compose -f docker-compose.node.yml --profile dashboard up -d
#
#   # Full node (GPU + dashboard):
#   docker compose -f docker-compose.node.yml --profile gpu --profile dashboard up -d
#
# Connect to AitherOS Core:
#   Set AITHER_CORE_URL and AITHER_NODE_TOKEN in .env
#
# =============================================================================

# ── Shared config ──
x-common-env: &common-env
  AITHERZERO_ROOT: /app
  AITHER_ENV: ${AITHER_ENV:-production}
  AITHER_LOG_LEVEL: ${AITHER_LOG_LEVEL:-INFO}
  AITHER_DOCKER_MODE: "true"
  AITHER_DEPLOYMENT: node
  AITHER_NODE_ID: ${AITHER_NODE_ID:-}
  AITHER_NODE_TOKEN: ${AITHER_NODE_TOKEN:-}
  AITHER_CORE_URL: ${AITHER_CORE_URL:-}
  AITHER_MESH_ENABLED: ${AITHER_MESH_ENABLED:-false}
  AITHER_GPU_PROFILE: ${AITHER_GPU_PROFILE:-standard}
  AITHER_INFERENCE_MODE: ${AITHER_INFERENCE_MODE:-dual}
  AITHER_HOST_GPU: ${AITHER_HOST_GPU:-unknown}
  AITHER_HOST_VRAM_MB: ${AITHER_HOST_VRAM_MB:-0}
  AITHER_HOST_RAM_MB: ${AITHER_HOST_RAM_MB:-0}
  AITHER_HOST_CPU: ${AITHER_HOST_CPU:-unknown}
  AITHER_HOST_TIMEZONE: ${AITHER_HOST_TIMEZONE:-UTC}
  AITHER_FLUX_URL: http://security-core:8117
  AITHER_TOPOLOGY_URL: ${AITHER_TOPOLOGY_URL:-http://mesh-agent:8125}
  AITHER_SPIRIT_URL: ${AITHER_SPIRIT_URL:-http://spirit:8087}
  AITHER_WORKING_MEMORY_URL: ${AITHER_WORKING_MEMORY_URL:-http://working-memory:8101}
  REDIS_URL: redis://redis:6379/0
  DATABASE_URL: postgresql://aither:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/aitheros
  OLLAMA_API_URL: ${OLLAMA_API_URL:-http://ollama:11434}

x-common-service: &common-service
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

# ── Build definitions (used when building locally instead of pulling from GHCR) ──
x-build-base: &build-base
  context: .
  dockerfile: AitherOS/Dockerfile.Services
  args:
    BASE_IMAGE: ${AITHEROS_BASE_IMAGE:-aitheros-base:latest}

x-build-core: &build-core
  <<: *build-base
  target: core

x-build-intelligence: &build-intelligence
  <<: *build-base
  target: intelligence

x-build-genesis: &build-genesis
  context: .
  dockerfile: docker/genesis/Dockerfile

x-build-node: &build-node
  context: .
  dockerfile: AitherOS/apps/awnode/docker/Dockerfile

x-build-security: &build-security
  <<: *build-base
  target: security

x-build-mesh: &build-mesh
  <<: *build-base
  target: gateway

x-resource-small: &resource-small
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: '1.0'

x-resource-medium: &resource-medium
  deploy:
    resources:
      limits:
        memory: 1G
        cpus: '2.0'

services:
  # ═══════════════════════════════════════════════════════════════════════
  #  INFRASTRUCTURE — Always starts
  # ═══════════════════════════════════════════════════════════════════════

  redis:
    image: redis:7-alpine
    container_name: aitheros-redis
    <<: *common-service
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    container_name: aitheros-postgres
    <<: *common-service
    environment:
      POSTGRES_USER: aither
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: aitheros
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aither -d aitheros"]
      interval: 10s
      timeout: 5s
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════════════
  #  CORE SERVICES — The awnode skeleton
  # ═══════════════════════════════════════════════════════════════════════

  genesis:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-genesis:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-genesis
    container_name: aitheros-genesis
    <<: [*common-service, *resource-medium]
    environment:
      <<: *common-env
      AITHER_SERVICE: genesis
      GENESIS_PORT: "8001"
      GENESIS_MODE: node
    ports:
      - "${GENESIS_PORT:-8001}:8001"
    volumes:
      - genesis-data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s

  pulse:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-core:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-core
    container_name: aitheros-pulse
    <<: [*common-service, *resource-small]
    environment:
      <<: *common-env
      AITHER_SERVICE: pulse
      AITHERPULSE_PORT: "8081"
    ports:
      - "${AITHERPULSE_PORT:-8081}:8081"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s

  secrets:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-core:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-core
    container_name: aitheros-secrets
    <<: [*common-service, *resource-small]
    environment:
      <<: *common-env
      AITHER_SERVICE: secrets
      AITHERSECRETS_PORT: "8111"
    ports:
      - "${AITHERSECRETS_PORT:-8111}:8111"
    volumes:
      - secrets-data:/var/lib/aither
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8111/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s

  chronicle:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-core:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-core
    container_name: aitheros-chronicle
    <<: [*common-service, *resource-small]
    environment:
      <<: *common-env
      AITHER_SERVICE: chronicle
      AITHERCHRONICLE_PORT: "8121"
    ports:
      - "${AITHERCHRONICLE_PORT:-8121}:8121"
    volumes:
      - chronicle-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8121/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s

  strata:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-core:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-core
    container_name: aitheros-strata
    <<: [*common-service, *resource-small]
    environment:
      <<: *common-env
      AITHER_SERVICE: strata
      AITHERSTRATA_PORT: "8136"
      # ── Upstream sync: push local telemetry/artifacts to cloud Strata ──
      STRATA_UPSTREAM_URL: ${STRATA_UPSTREAM_URL:-}
      STRATA_UPSTREAM_TOKEN: ${AITHER_NODE_TOKEN:-}
      STRATA_SYNC_ENABLED: ${STRATA_SYNC_ENABLED:-false}
      STRATA_SYNC_INTERVAL_SECONDS: ${STRATA_SYNC_INTERVAL_SECONDS:-60}
    ports:
      - "${AITHERSTRATA_PORT:-8136}:8136"
    volumes:
      - strata-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8136/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s

  watch:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-core:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-core
    container_name: aitheros-watch
    <<: [*common-service, *resource-small]
    environment:
      <<: *common-env
      AITHER_SERVICE: watch
      AITHERWATCH_PORT: "8082"
    ports:
      - "${AITHERWATCH_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      start_period: 10s

  node:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-node:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-node
    container_name: aitheros-node
    <<: [*common-service, *resource-small]
    environment:
      <<: *common-env
      AITHER_SERVICE: node
      AITHERNODE_PORT: "8080"
    ports:
      - "${AITHERNODE_PORT:-8080}:8080"
    volumes:
      - node-data:/data
    depends_on:
      genesis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════
  #  PROFILE: federate — AitherFederate bridge to portal.aitherium.com
  # ═══════════════════════════════════════════════════════════════════════
  #  Optional: agent-fleet registration, product-catalog federation, and
  #  knowledge ingestion routing. Requires AITHER_PORTAL_TOKEN (get one from
  #  your Aitherium portal account) — `adk deploy node --federate` enforces
  #  this before attempting to start the container.

  aither-federate:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aither-connect:${AITHEROS_IMAGE_TAG:-latest}
    container_name: aitheros-federate
    profiles: ["federate"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      <<: *common-env
      AITHER_SERVICE: connect
      AITHERFEDERATE_PORT: "8094"
      AITHER_MODULE: services.communication.AitherFederate
      AITHER_PORTAL_URL: "${AITHER_PORTAL_URL:-https://api.aitherium.com}"
      AITHER_PORTAL_TOKEN: "${AITHER_PORTAL_TOKEN:?AITHER_PORTAL_TOKEN must be set — get one from your Aitherium portal account}"
      AITHER_NODE_ID: "${AITHER_NODE_ID:-}"
      AITHER_TENANT_ID: "${AITHER_TENANT_ID:-}"
      GENESIS_URL: "http://genesis:8001"
    ports:
      - "${AITHERFEDERATE_PORT:-8094}:8094"
    depends_on:
      genesis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8094/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  microscheduler:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-intelligence:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-intelligence
    container_name: aitheros-microscheduler
    <<: [*common-service, *resource-medium]
    environment:
      <<: *common-env
      AITHER_SERVICE: microscheduler
      AITHERMICROSCHEDULER_PORT: "8150"
      VLLM_URL: ${VLLM_URL:-http://aither-vllm:8120}
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://ollama:11434}
      AITHER_CORE_LLM_URL: ${AITHER_CORE_LLM_URL:-}
      AITHER_NODE_TOKEN: ${AITHER_NODE_TOKEN:-}
    ports:
      - "${AITHERMICROSCHEDULER_PORT:-8150}:8150"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8150/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s

  llm:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-intelligence:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-intelligence
    container_name: aitheros-llm
    <<: [*common-service, *resource-medium]
    environment:
      <<: *common-env
      AITHER_SERVICE: llm
      AITHERLLM_PORT: "8118"
      OLLAMA_API_URL: ${OLLAMA_API_URL:-http://ollama:11434}
      VLLM_URL: ${VLLM_URL:-http://aither-vllm:8120}
    ports:
      - "${AITHERLLM_PORT:-8118}:8118"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8118/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════
  #  FLUX — Event bus + packet routing (required for cross-node comms)
  # ═══════════════════════════════════════════════════════════════════════

  security-core:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-security-core:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-security
    container_name: aitheros-security-core
    <<: [*common-service, *resource-medium]
    environment:
      <<: *common-env
      AITHER_SERVICE: security_core
      AITHERSECURITYCORE_PORT: "8117"
      AITHER_MODULE: services.security.security_core
      AITHER_TOPOLOGY_URL: http://mesh-agent:8125
    ports:
      - "${AITHERSECURITYCORE_PORT:-8117}:8117"
    depends_on:
      redis:
        condition: service_healthy
      secrets:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8117/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s

  # ═══════════════════════════════════════════════════════════════════════
  #  MESH AGENT — Node discovery, registration, heartbeat
  # ═══════════════════════════════════════════════════════════════════════

  mesh-agent:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-mesh-core:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-mesh
    container_name: aitheros-mesh-agent
    <<: [*common-service, *resource-small]
    environment:
      <<: *common-env
      AITHER_SERVICE: mesh_core
      AITHERMESHCORE_PORT: "8125"
      AITHER_MODULE: services.mesh.mesh_core
      AITHER_MESH_MODE: ${AITHER_MESH_MODE:-client}
      AITHER_CORE_URL: ${AITHER_CORE_URL:-}
      AITHER_NODE_TOKEN: ${AITHER_NODE_TOKEN:-}
      AITHER_MESH_PSK: ${AITHER_NODE_TOKEN:-}
    ports:
      - "${AITHERMESHCORE_PORT:-8125}:8125"
    depends_on:
      genesis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8125/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s

  # ── Local LLM (always included) ──

  ollama:
    image: ollama/ollama:latest
    container_name: aitheros-ollama
    <<: *common-service
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════════════
  #  PROFILE: memory — Persistent vector memory (Spirit + WorkingMemory)
  # ═══════════════════════════════════════════════════════════════════════
  #  Adds real-time memory services so agents have vector-search memory,
  #  scoped per-tenant and per-agent. Without this, agents use local SQLite.

  spirit:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-intelligence:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-intelligence
    container_name: aitheros-spirit
    profiles: ["memory"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      <<: *common-env
      AITHER_SERVICE: spirit
      AITHERSPIRIT_PORT: "8087"
    ports:
      - "${AITHERSPIRIT_PORT:-8087}:8087"
    volumes:
      - spirit-data:/data
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8087/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  working-memory:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-intelligence:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-intelligence
    container_name: aitheros-working-memory
    profiles: ["memory"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      <<: *common-env
      AITHER_SERVICE: working_memory
      AITHERWORKINGMEMORY_PORT: "8101"
      AITHER_SPIRIT_URL: http://spirit:8087
    ports:
      - "${AITHERWORKINGMEMORY_PORT:-8101}:8101"
    volumes:
      - working-memory-data:/data
    depends_on:
      redis:
        condition: service_healthy
      spirit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8101/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  # ═══════════════════════════════════════════════════════════════════════
  #  PROFILE: gpu — GPU-accelerated vLLM backend
  # ═══════════════════════════════════════════════════════════════════════

  vllm:
    image: vllm/vllm-openai:${AITHER_VLLM_IMAGE_TAG:-latest}
    container_name: aitheros-vllm
    profiles: ["gpu"]
    <<: *common-service
    shm_size: '4gb'
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      VLLM_NO_USAGE_STATS: '1'
      HF_TOKEN: ${HF_TOKEN:-}
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    # Model and quantization are fully env-var configurable.
    # adk setup writes these to .env based on GPU detection:
    #   AITHER_VLLM_MODEL       — model ID (default: Nemotron-Orchestrator-8B)
    #   AITHER_VLLM_GPU_UTIL    — fraction of VRAM (0.35-0.85)
    #   AITHER_VLLM_CTX_LEN     — context length (8192-32768)
    #   AITHER_VLLM_QUANT_ARGS  — quantization flags (TQ4 for small GPUs, BNB for large)
    command: >
      --model ${AITHER_VLLM_MODEL:-nvidia/Nemotron-Orchestrator-8B}
      --served-model-name aither-orchestrator
      --gpu-memory-utilization ${AITHER_VLLM_GPU_UTIL:-0.35}
      --max-model-len ${AITHER_VLLM_CTX_LEN:-16384}
      --port 8120
      --enable-auto-tool-choice
      --tool-call-parser hermes
      --enable-prefix-caching
      --trust-remote-code
      --dtype auto
      --max-num-seqs 8
      ${AITHER_VLLM_QUANT_ARGS:-}
    ports:
      - "${VLLM_PORT:-8120}:8120"
    volumes:
      - vllm-cache:/root/.cache
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8120/health"]
      interval: 30s
      timeout: 15s
      start_period: 300s
      retries: 10

  # ═══════════════════════════════════════════════════════════════════════
  #  PROFILE: dashboard — Portal-kit workspace app (NOT full Veil platform)
  # ═══════════════════════════════════════════════════════════════════════
  #  Lightweight awkit tenant app with chat, agent dispatch, settings.
  #  Uses WorkspaceRuntime template. Veil (the platform site) stays on
  #  demo.aitherium.com — node deployers get their own workspace portal.

  workspace-app:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-workspace:${AITHEROS_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: AitherOS/apps/WorkspaceRuntime/backend/Dockerfile
    container_name: aitheros-workspace-app
    profiles: ["dashboard"]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      <<: *common-env
      APP_ID: ${AITHER_NODE_ID:-workspace}
      APP_PORT: "3000"
      LLM_PROVIDER: aitheros
      DEPLOYMENT_MODE: node
      GENESIS_URL: http://genesis:8001
      STRATA_URL: http://strata:8136
      QDRANT_URL: http://workspace-qdrant:6333
      COLLECTION_NAME: ${AITHER_NODE_ID:-workspace}
    ports:
      - "${WORKSPACE_PORT:-3000}:3000"
    volumes:
      - workspace-data:/app/data
    depends_on:
      genesis:
        condition: service_healthy
      workspace-qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  workspace-qdrant:
    image: qdrant/qdrant:latest
    container_name: aitheros-workspace-qdrant
    profiles: ["dashboard"]
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT__SERVICE__API_KEY:-}
    volumes:
      - workspace-qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # ═══════════════════════════════════════════════════════════════════════
  #  PROFILE: mesh — Join AitherOS mesh network
  # ═══════════════════════════════════════════════════════════════════════

  # Note: mesh-agent (above) handles mesh connectivity.
  # With --profile mesh, it auto-joins the core mesh on startup.
  # The mesh-client profile enables the WireGuard overlay for encrypted tunnels.

  mesh-overlay:
    image: ${AITHEROS_REGISTRY:-ghcr.io/aitherium}/aitheros-mesh-core:${AITHEROS_IMAGE_TAG:-latest}
    build:
      <<: *build-mesh
    container_name: aitheros-mesh-overlay
    profiles: ["mesh"]
    <<: *common-service
    environment:
      <<: *common-env
      AITHER_SERVICE: mesh_overlay
      AITHER_MESH_MODE: overlay
      AITHER_CORE_URL: ${AITHER_CORE_URL}
      AITHER_NODE_TOKEN: ${AITHER_NODE_TOKEN}
      AITHER_MESH_PSK: ${AITHER_NODE_TOKEN}
      AITHER_MESH_ENABLED: "true"
    cap_add:
      - NET_ADMIN  # Required for WireGuard tunnel
    depends_on:
      mesh-agent:
        condition: service_healthy
      security-core:
        condition: service_healthy

