<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Aither KV holder engine</title></head>
<body>
<script src="holder.js"></script>
<script src="kvdevice.js"></script>
<script>
// The engine the HolderService hosts. Native code owns the policy (charging, Wi-Fi, the
// owner's switch) and calls kvStart() / kvStop(); this page owns the holder and the link.
(async function () {
  'use strict';
  const native = window.AitherKV;
  const cfg = JSON.parse(native.getConfig());
  const relayHost = new URL(cfg.relay.replace(/^wss:/, 'https:')).hostname;
  let device = null, engine = null, holder = null, ws = null, want = false, state = 'idle', backoff = 1000, lastErr = '';

  try {
    device = await KVDevice.open(KVDevice.idbStore('aither-kvholder'));
    native.onKey(device.publicHex);
  } catch (e) { state = 'no device key: ' + e; report(); return; }

  async function makeEngine() {
    if (engine) return engine;
    try { if (navigator.gpu) engine = await KVHolder.GpuEngine.create(navigator.gpu, {}); } catch (e) { engine = null; }
    if (!engine) engine = new KVHolder.CpuEngine();
    return engine;
  }

  function report() {
    const h = holder;
    native.onStatus(JSON.stringify({
      state, engine: engine ? engine.describe() : '', held: h && h.cfg ? h.maxHeld() : 0,
      calls: h ? h.calls : 0, last_ms: h ? h.lastMs : 0, link: ws && ws.readyState === 1 ? 'open' : 'down',
      error: lastErr,
    }));
  }

  async function dial() {
    if (!want) return;
    await makeEngine();
    // one holder for the whole loan: a reconnect re-announces the keys it kept
    if (!holder) holder = new KVHolder.Holder(engine, cfg.mb * 1048576, cfg.device_id);
    state = 'connecting'; report();
    ws = KVHolder.connect(cfg.relay, '', holder, {
      hello: () => device.hello(relayHost, cfg.device_id),
      attached: () => { state = 'attached'; backoff = 1000; lastErr = ''; report(); },
      error: (e) => { lastErr = String(e); if (/allowed|workspace|signature|relay/.test(lastErr)) native.onRefused(lastErr); report(); },
      closed: () => {
        ws = null;
        if (!want) return;
        state = 'retrying'; report();
        setTimeout(dial, backoff); backoff = Math.min(backoff * 2, 60000);
      },
    });
  }

  window.kvStart = () => { if (want) return; want = true; dial(); };
  window.kvStop = () => {
    want = false;
    if (ws) { ws.onclose = null; try { ws.close(); } catch (e) { /* gone */ } ws = null; }
    holder = null; state = 'idle'; report();  // frees the lent memory
  };
  setInterval(report, 2000);
  report();
})();
</script>
</body></html>
